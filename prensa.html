<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KyoSumiVT · Kit de prensa</title>
<meta name="description" content="Kit de prensa de KyoSumiVT, VTuber chica tiburón · Media kit">
<link rel="icon" href="logo/favicon-32.png">
<link rel="stylesheet" href="fonts/escenas.css">
<!--
  KyoWidgets · Kit de prensa (ES / EN). Página pública para enviar a marcas y botón para
  descargarla en PDF (2 hojas A4). Los datos se editan en Kyo Estudio → 📰 Prensa y se
  leen de la función "prensa" de Supabase; si no hay nada guardado, usa prensa/datos.js.
  Parámetros:  lang=es|en   imprimir=1 (abre la ventana de PDF sola)   preview=1 (vista previa del Estudio)
-->
<script src="config.js"></script>
<script src="prensa/datos.js"></script>
<style>
:root{--abisal:#0A1030;--indigo:#2B2F7A;--aleta:#3A7BD5;--bioluz:#6FE3F0;--espuma:#C9E6F2;--lavanda:#BDB0E6;--carmesi:#B3263F;--perla:#F5F3FB;--oro:#F4C542;--caja:#0f1a4a}
*{box-sizing:border-box}
html{background:#050820}
body{margin:0;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--perla);-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* barra (solo en pantalla) */
.barra{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:12px 16px;background:rgba(5,8,32,.88);backdrop-filter:blur(8px);border-bottom:1px solid rgba(111,227,240,.18)}
.barra b{font:400 20px "Cherry Bomb One",sans-serif;margin-right:6px}
.idiomas{display:flex;border-radius:999px;overflow:hidden;box-shadow:0 0 0 2px var(--bioluz)}
.idiomas button{font:700 14px "Chakra Petch",monospace;letter-spacing:.1em;border:0;padding:8px 16px;background:transparent;color:var(--bioluz);cursor:pointer}
.idiomas button[aria-pressed="true"]{background:var(--bioluz);color:var(--abisal)}
.pdf{font:700 15px "Fredoka",sans-serif;border:0;border-radius:999px;padding:9px 20px;background:var(--oro);color:var(--abisal);cursor:pointer;box-shadow:0 4px 0 #9c7a12}
.pdf:active{transform:translateY(2px);box-shadow:0 2px 0 #9c7a12}
.hojas{display:grid;justify-content:center;gap:28px;padding:24px 16px 60px}
/* hoja A4 */
.hoja{position:relative;width:210mm;height:297mm;overflow:hidden;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55);
  background:radial-gradient(90mm 70mm at 82% 14%,rgba(201,230,242,.10),transparent 70%),linear-gradient(180deg,#0A1030 0%,#0f1850 55%,#15296e 100%)}
.cielo{position:absolute;inset:0;pointer-events:none}
.dentro{position:relative;z-index:2;height:100%;padding:13mm 14mm 0;display:flex;flex-direction:column;gap:6mm}
/* elementos */
.chip{display:inline-block;font:700 11.5px "Chakra Petch",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--abisal);background:var(--bioluz);padding:5px 14px 5px 16px;border-radius:999px;white-space:nowrap}
.chip.oro{background:var(--oro)}
.chip.hueco{background:transparent;color:var(--bioluz);box-shadow:inset 0 0 0 2px var(--bioluz)}
.pega{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--abisal),0 7px 0 8px var(--abisal)}
.tarjeta{background:var(--caja);border-radius:22px;padding:5mm 6mm}
.titulo{margin:0 0 3mm;font:400 24px/1.1 "Cherry Bomb One",sans-serif;color:var(--perla);-webkit-text-stroke:7px var(--abisal);paint-order:stroke fill;display:flex;align-items:center;gap:8px}
.titulo svg{width:22px;height:22px;flex:none}
.arriba{display:flex;justify-content:space-between;align-items:center}
.arriba small{font:600 11px "Chakra Petch",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--espuma);opacity:.8}
/* hoja 1 */
.hero{display:grid;grid-template-columns:1fr 80mm;gap:4mm;align-items:end;min-height:108mm}
.hero > div:first-child{padding-bottom:18mm}
.nombre{margin:0;font:400 64px/.95 "Cherry Bomb One",sans-serif;color:var(--perla);-webkit-text-stroke:14px var(--abisal);paint-order:stroke fill;letter-spacing:.01em}
.nombre span{color:var(--bioluz)}
.rol{margin:4mm 0 3mm}
.lema{margin:0;font:600 19px/1.35 "Fredoka",sans-serif;color:var(--espuma)}
.handle{margin-top:4mm;display:flex;flex-wrap:wrap;gap:6px}
.handle span{font:600 12px "Chakra Petch",monospace;letter-spacing:.06em;color:var(--perla);background:rgba(111,227,240,.12);border:1px solid rgba(111,227,240,.35);border-radius:999px;padding:4px 11px}
.arte{position:relative;height:124mm;margin-bottom:-16mm;display:flex;align-items:flex-end;justify-content:center;z-index:1}
.arte .luna{position:absolute;width:66mm;height:66mm;border-radius:50%;top:4mm;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 40% 38%,#f5f3fb,#c9e6f2 55%,#9fc6e0);box-shadow:0 0 40px 12px rgba(201,230,242,.35)}
.arte img{position:relative;max-height:124mm;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.bio{position:relative;z-index:3}
.bio p{margin:0;font:500 13.5px/1.6 "M PLUS Rounded 1c",sans-serif;color:var(--perla)}
.datos{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:5mm}
.dato{text-align:center;padding:4.5mm 3mm}
.dato b{display:block;font:700 34px/1 "Fredoka",sans-serif;color:var(--oro)}
.dato span{display:block;margin-top:2mm;font:700 10px "Chakra Petch",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--espuma)}
.pie-ola{margin-top:auto;position:relative;height:30mm;margin-left:-14mm;margin-right:-14mm}
.pie-ola svg{position:absolute;inset:0;width:100%;height:100%}
.pie-ola p{position:absolute;left:0;right:0;bottom:7mm;margin:0;text-align:center;font:400 17px "Cherry Bomb One",sans-serif;color:var(--perla);-webkit-text-stroke:6px var(--abisal);paint-order:stroke fill}
/* hoja 2 */
.redes{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
.red{display:grid;grid-template-columns:38px 1fr;gap:3mm;align-items:center;padding:3.5mm 4mm;border-radius:18px;background:var(--caja);box-shadow:0 0 0 2px rgba(111,227,240,.35)}
.red .ic{width:38px;height:38px;border-radius:12px;background:var(--bioluz);display:grid;place-items:center}
.red .ic svg{width:22px;height:22px}
.red b{display:block;font:700 15px "Fredoka",sans-serif}
.red small{display:block;font:500 11.5px "M PLUS Rounded 1c",sans-serif;color:var(--espuma);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.red em{font:700 13px "Fredoka",sans-serif;font-style:normal;color:var(--oro)}
.dos{display:grid;grid-template-columns:1.25fr 1fr;gap:5mm}
.chips{display:flex;flex-wrap:wrap;gap:2.5mm}
.chips span{font:700 12.5px "Fredoka",sans-serif;padding:5px 12px;border-radius:999px;background:rgba(111,227,240,.14);border:1.5px solid rgba(111,227,240,.55);color:var(--perla)}
.aud{display:grid;gap:2.5mm}
.aud div{display:flex;justify-content:space-between;gap:3mm;align-items:baseline;border-bottom:1px dashed rgba(201,230,242,.25);padding-bottom:2mm}
.aud span{font:700 10px "Chakra Petch",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--espuma)}
.aud b{font:700 15px "Fredoka",sans-serif;color:var(--oro);text-align:right}
.lista{margin:0;padding:0;list-style:none;display:grid;gap:2.2mm}
.lista li{display:grid;grid-template-columns:16px 1fr;gap:3mm;font:500 13px/1.45 "M PLUS Rounded 1c",sans-serif}
.lista svg{width:16px;height:16px;margin-top:2px}
.servicios span{background:transparent;border-color:var(--bioluz)}
.tarifa{margin-top:3.5mm;display:flex;align-items:center;gap:3mm;flex-wrap:wrap}
.tarifa p{margin:0;font:500 12px "M PLUS Rounded 1c",sans-serif;color:var(--espuma)}
.marcas span{background:rgba(244,197,66,.12);border-color:rgba(244,197,66,.6)}
.contacto{margin-top:auto;position:relative;display:grid;grid-template-columns:1fr 46mm;align-items:end;gap:4mm;min-height:52mm;margin-bottom:10mm}
.contacto .tarjeta{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:2.5mm}
.contacto h3{margin:0;font:400 30px/1 "Cherry Bomb One",sans-serif;color:var(--oro);-webkit-text-stroke:8px var(--abisal);paint-order:stroke fill}
.contacto .mail{display:flex;align-items:center;gap:3mm;font:700 18px "Fredoka",sans-serif;color:var(--perla);word-break:break-all}
.contacto .mail svg{width:24px;height:24px;flex:none}
.contacto .mail.falta{color:var(--lavanda);font-size:14px;font-style:italic}
.contacto small{font:500 12px "M PLUS Rounded 1c",sans-serif;color:var(--espuma)}
.contacto img{max-height:60mm;max-width:100%;justify-self:center;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
.actualizado{position:absolute;left:14mm;bottom:4mm;z-index:3;font:600 9.5px "Chakra Petch",monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(201,230,242,.6)}
[hidden]{display:none!important}
@media print{
  @page{size:A4;margin:0}
  html,body{background:none}
  .barra{display:none}
  .hojas{display:block;padding:0}
  .hoja{border-radius:0;box-shadow:none;break-after:page;page-break-after:always;zoom:1!important;margin:0}
  .hoja:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="barra" id="barra">
  <b>KyoSumiVT</b>
  <div class="idiomas" role="group" aria-label="Idioma"><button type="button" data-lang="es" aria-pressed="true">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  <button class="pdf" type="button" id="pdf">⬇ Descargar PDF</button>
</div>
<div class="hojas" id="hojas"></div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const PREVIEW = q.get('preview') === '1';
  let lang = q.get('lang') === 'en' ? 'en' : 'es';
  let datos = Object.assign({}, window.KYO_PRENSA_DEF || {});
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tx = o => (o && typeof o === 'object') ? (o[lang] || o.es || o.en || '') : (o || '');
  const L = {
    es: { kit: 'Kit de prensa', sobre: 'Sobre mí', redes: 'Dónde me encuentras', seguidores: 'seguidores', contenido: 'Mi contenido', audiencia: 'Mi comunidad', destacados: 'Destacados', colabora: 'Colabora conmigo', tarifas: 'Tarifas a consultar', tarifasNota: 'Cuéntame tu idea y te preparo una propuesta a medida.', marcas: 'Han confiado en mí', hablamos: '¿Hablamos?', sinCorreo: 'Añade tu correo en Kyo Estudio → 📰 Prensa', actualizado: 'Actualizado', pdf: '⬇ Descargar PDF', gracias: '¡Gracias por nadar conmigo!', titulo: 'Kit de prensa' },
    en: { kit: 'Media kit', sobre: 'About me', redes: 'Where to find me', seguidores: 'followers', contenido: 'My content', audiencia: 'My community', destacados: 'Highlights', colabora: 'Work with me', tarifas: 'Rates available on request', tarifasNota: 'Tell me your idea and I\'ll put together a tailored proposal.', marcas: 'Brands I\'ve worked with', hablamos: 'Let\'s talk!', sinCorreo: 'Add your email in Kyo Estudio → 📰 Prensa', actualizado: 'Updated', pdf: '⬇ Download PDF', gracias: 'Thanks for swimming with me!', titulo: 'Media kit' }
  };
  // Iconos propios (nada de logos de otras marcas)
  const IC = {
    directo: '<svg viewBox="0 0 24 24" fill="none" stroke="#0A1030" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M8 21h8M10 10l4 2-4 2z" fill="#0A1030"/><path d="M8 2l4 4 4-4"/></svg>',
    nota: '<svg viewBox="0 0 24 24" fill="none" stroke="#0A1030" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="#0A1030"/><circle cx="17" cy="16" r="3" fill="#0A1030"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="#0A1030" stroke-width="2.4" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="#0A1030"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="#0A1030" stroke-width="2.4" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5" stroke-linecap="round"/></svg>',
    grupo: '<svg viewBox="0 0 24 24" fill="none" stroke="#0A1030" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15 14.2c3 0 6 1.6 6 4.8"/></svg>',
    web: '<svg viewBox="0 0 24 24" fill="none" stroke="#0A1030" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>',
    aleta: '<svg viewBox="0 0 24 24"><path d="M3 20c4-1 8-5 9-16 2 5 5 11 9 16z" fill="#0A1030"/></svg>'
  };
  const ICON_OPS = ['directo', 'nota', 'play', 'chat', 'grupo', 'web', 'aleta'];
  const MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="#6FE3F0" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>';
  const ESTRELLA = c => '<svg viewBox="0 0 100 100"><path d="M50 0C53 38 62 47 100 50 62 53 53 62 50 100 47 62 38 53 0 50 38 47 47 38 50 0Z" fill="' + c + '"/></svg>';
  const ico = (n, c) => '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0C53 38 62 47 100 50 62 53 53 62 50 100 47 62 38 53 0 50 38 47 47 38 50 0Z" fill="' + (c || '#F4C542') + '"/></svg>';
  const img = v => v === 'kyo' ? 'prensa/kyo.webp' : v === 'kyo3d' ? 'prensa/kyo-3d.webp' : (/^https:\/\//.test(v || '') ? v : '');

  // Cielo con estrellas (siempre igual, para que el PDF salga idéntico)
  function cielo(semilla, alto) {
    let s = semilla; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    let pts = '';
    for (let i = 0; i < 70; i++) { const x = r() * 794, y = r() * alto, rad = .6 + r() * 1.6; pts += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + rad.toFixed(2) + '" fill="#fff" opacity="' + (.25 + r() * .6).toFixed(2) + '"/>'; }
    for (let i = 0; i < 6; i++) { const x = r() * 794, y = r() * alto * .8, t = 8 + r() * 10; pts += '<path transform="translate(' + x.toFixed(0) + ' ' + y.toFixed(0) + ') scale(' + (t / 100).toFixed(2) + ')" d="M50 0C53 38 62 47 100 50 62 53 53 62 50 100 47 62 38 53 0 50 38 47 47 38 50 0Z" fill="' + (i % 2 ? '#F4C542' : '#C9E6F2') + '" opacity=".85"/>'; }
    return '<svg class="cielo" viewBox="0 0 794 1123" preserveAspectRatio="none" aria-hidden="true">' + pts + '</svg>';
  }
  const OLA = '<svg viewBox="0 0 794 113" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 Q50 5 100 30 T200 30 T300 30 T400 30 T500 30 T600 30 T700 30 T800 30 V113 H0Z" fill="#3A7BD5" stroke="#0A1030" stroke-width="10"/><path d="M0 30 Q50 5 100 30 T200 30 T300 30 T400 30 T500 30 T600 30 T700 30 T800 30" fill="none" stroke="#fff" stroke-width="4"/><g fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2.5"><circle cx="120" cy="70" r="7"/><circle cx="300" cy="88" r="5"/><circle cx="520" cy="66" r="9"/><circle cx="690" cy="84" r="6"/></g></svg>';

  function hoja1(d) {
    const datosOk = (d.datos || []).filter(x => String(x.valor || '').trim());
    const dest = (d.destacados || []).map(tx).filter(Boolean);
    const nombre = esc(d.nombre || 'KyoSumiVT').replace(/VT$/, '<span>VT</span>');
    const handles = (d.redes || []).slice(0, 3).map(r => '<span>' + esc(r.red) + ' · ' + esc(r.usuario) + '</span>').join('');
    return '<section class="hoja">' + cielo(7, 1123) +
      '<div class="dentro">' +
        '<div class="arriba"><span class="chip">' + L[lang].kit + '</span><small>' + (d.actualizado ? L[lang].actualizado + ' · ' + fecha(d.actualizado) : '') + '</small></div>' +
        '<div class="hero"><div>' +
          '<h1 class="nombre">' + nombre + '</h1>' +
          '<div class="rol"><span class="chip oro">' + esc(tx(d.rol)) + '</span></div>' +
          '<p class="lema">' + esc(tx(d.lema)) + '</p>' +
          '<div class="handle">' + handles + '</div>' +
        '</div><div class="arte"><div class="luna"></div>' + (img(d.imagen) ? '<img src="' + esc(img(d.imagen)) + '" alt="">' : '') + '</div></div>' +
        '<div class="tarjeta pega bio"><h2 class="titulo">' + ico() + L[lang].sobre + '</h2><p>' + esc(tx(d.bio)) + '</p></div>' +
        (datosOk.length ? '<div class="datos" style="--n:' + datosOk.length + '">' + datosOk.map(x => '<div class="tarjeta pega dato"><b>' + esc(x.valor) + '</b><span>' + esc(tx(x)) + '</span></div>').join('') + '</div>' : '') +
        (dest.length ? '<div><h2 class="titulo">' + ico() + L[lang].destacados + '</h2><ul class="lista">' + dest.map(x => '<li>' + ESTRELLA('#F4C542') + '<span>' + esc(x) + '</span></li>').join('') + '</ul></div>' : '') +
        '<div class="pie-ola">' + OLA + '<p>' + L[lang].gracias + ' 🦈</p></div>' +
      '</div></section>';
  }
  function hoja2(d) {
    const redes = (d.redes || []).filter(r => r.red || r.usuario);
    const cont = (d.contenido || []).map(tx).filter(Boolean);
    const aud = (d.audiencia || []).filter(a => String(a.valor || '').trim() || tx(a.texto));
    const serv = (d.servicios || []).map(tx).filter(Boolean);
    const marcas = (d.marcas || []).filter(m => m.nombre);
    const c = d.contacto || {};
    return '<section class="hoja">' + cielo(21, 1123) +
      '<div class="dentro">' +
        '<div><h2 class="titulo">' + ico() + L[lang].redes + '</h2><div class="redes">' +
          redes.map(r => '<div class="red"><span class="ic">' + (IC[r.icono] || IC.aleta) + '</span><div><b>' + esc(r.red) + '</b><small>' + esc(r.usuario) + '</small>' +
            (String(r.seguidores || '').trim() ? '<em>' + esc(r.seguidores) + ' ' + L[lang].seguidores + '</em>' : '') + '</div></div>').join('') +
        '</div></div>' +
        '<div class="dos">' +
          (cont.length ? '<div class="tarjeta pega"><h2 class="titulo">' + ico('', '#6FE3F0') + L[lang].contenido + '</h2><div class="chips">' + cont.map(x => '<span>' + esc(x) + '</span>').join('') + '</div></div>' : '<div></div>') +
          (aud.length ? '<div class="tarjeta pega"><h2 class="titulo">' + ico('', '#BDB0E6') + L[lang].audiencia + '</h2><div class="aud">' + aud.map(a => '<div><span>' + esc(tx(a)) + '</span><b>' + esc(tx(a.texto) || a.valor) + '</b></div>').join('') + '</div></div>' : '<div></div>') +
        '</div>' +
        '<div class="tarjeta pega"><h2 class="titulo">' + ico('', '#6FE3F0') + L[lang].colabora + '</h2>' +
          (serv.length ? '<div class="chips servicios">' + serv.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' : '') +
          '<div class="tarifa"><span class="chip oro">' + L[lang].tarifas + '</span><p>' + L[lang].tarifasNota + '</p></div>' +
          (marcas.length ? '<h2 class="titulo" style="margin-top:4mm;font-size:18px">' + L[lang].marcas + '</h2><div class="chips marcas">' + marcas.map(m => '<span>' + esc(m.nombre) + (tx(m) ? ' · ' + esc(tx(m)) : '') + '</span>').join('') + '</div>' : '') +
        '</div>' +
        '<div class="contacto"><div class="tarjeta pega"><h3>' + L[lang].hablamos + '</h3>' +
          (c.email ? '<div class="mail">' + MAIL + esc(c.email) + '</div>' : '<div class="mail falta">' + L[lang].sinCorreo + '</div>') +
          '<small>' + [c.web, tx(c.extra)].filter(Boolean).map(esc).join(' · ') + '</small></div>' +
          (img(d.imagen2) ? '<img src="' + esc(img(d.imagen2)) + '" alt="">' : '<div></div>') + '</div>' +
      '</div>' +
      '<div class="actualizado">@' + esc((d.nombre || 'KyoSumiVT')) + ' · ' + L[lang].titulo + '</div>' +
      '</section>';
  }
  function fecha(iso) { const f = new Date(iso); return isNaN(f) ? '' : f.toLocaleDateString(lang === 'en' ? 'en-GB' : 'es-ES', { month: 'long', year: 'numeric' }); }

  function pintar() {
    document.documentElement.lang = lang;
    document.title = (datos.nombre || 'KyoSumiVT') + ' · ' + L[lang].titulo + (lang === 'en' ? ' (EN)' : ' (ES)');
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
    document.getElementById('pdf').textContent = L[lang].pdf;
    document.getElementById('hojas').innerHTML = hoja1(datos) + hoja2(datos);
    encajar();
  }
  // En pantallas pequeñas las hojas se reducen para caber (al imprimir salen a tamaño real)
  function encajar() {
    const k = Math.min(1, (window.innerWidth - 32) / 794);
    document.querySelectorAll('.hoja').forEach(h => h.style.zoom = k < 1 ? k : '');
  }
  window.addEventListener('resize', encajar);
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang; const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); pintar();
  }));
  async function listo() { try { await document.fonts.ready; } catch (e) {} await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))); }
  document.getElementById('pdf').addEventListener('click', async () => { await listo(); window.print(); });

  if (PREVIEW) {
    document.getElementById('barra').hidden = true;
    window.addEventListener('message', e => {
      if (!e.data || e.data.tipo !== 'kyo-prensa') return;
      if (e.data.datos) datos = Object.assign({}, window.KYO_PRENSA_DEF || {}, e.data.datos);
      if (e.data.lang) lang = e.data.lang === 'en' ? 'en' : 'es';
      pintar();
    });
    pintar();
    return;
  }
  pintar();
  (async () => {
    const K = window.KYO || {};
    if (K.SUPABASE_URL && !/TU-PROYECTO/.test(K.SUPABASE_URL)) {
      try {
        const r = await fetch(K.SUPABASE_URL + '/functions/v1/prensa?t=' + Date.now(), { headers: { apikey: K.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + K.SUPABASE_ANON_KEY }, cache: 'no-store' });
        const d = await r.json();
        if (d && d.ok && d.datos) { datos = Object.assign({}, window.KYO_PRENSA_DEF || {}, d.datos); pintar(); }
      } catch (e) { /* sin conexión: se queda con los datos por defecto */ }
    }
    if (q.get('imprimir') === '1') { await listo(); setTimeout(() => window.print(), 300); }
  })();
})();
</script>
</body>
</html>
