<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KyoWidgets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--bg:#0a0720;--card:#15103a;--line:rgba(184,149,255,.25);--acc:#FF8A2B;--pur:#B895FF;--txt:#F5F3FB;--sub:#d8d2f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Fredoka",system-ui,sans-serif;padding:28px 18px 60px}
.w{max-width:980px;margin:0 auto;display:grid;gap:18px}
h1{font-family:"Cherry Bomb One",sans-serif;font-weight:400;font-size:44px;margin:0}
p{margin:0;color:var(--sub);line-height:1.5}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 0 0 1px var(--line);display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--sub)}
input,select{font:inherit;background:#0e0a2a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:170px}
code{display:block;background:#0e0a2a;border-radius:10px;padding:10px 12px;word-break:break-all;color:#ffd08a}
button{font:600 15px "Fredoka",sans-serif;background:var(--acc);color:#1a0d05;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
iframe{width:100%;border:0;border-radius:14px;background:repeating-conic-gradient(#1a1440 0 25%,#221a52 0 50%) 0 0/24px 24px}
</style>
</head>
<body>
<div class="w">
  <h1>KyoWidgets</h1>
  <p>Generador de enlaces para OBS. Elige el widget, ajusta las opciones y copia la URL en una Fuente de navegador.</p>
  <div class="card">
    <div class="row">
      <label>Widget<select id="wid"><option value="spotify">Música (Spotify) · 720×180</option><option value="fortnite">Fortnite · 760×250</option></select></label>
      <label>Estilo<select id="tema"><option value="octubre">Halloween</option><option value="marea">Normal</option></select></label>
      <label>Vista previa<select id="demo"><option value="1">Con datos de ejemplo</option><option value="0">Con mis datos reales</option></select></label>
    </div>
    <div class="row" id="opSp">
      <label>Cuándo se ve<select id="modo"><option value="siempre">Siempre (mientras suena)</option><option value="cambio">Solo al cambiar de canción</option></select></label>
      <label>Segundos visible (modo cambio)<input id="seg" type="number" value="12" min="3"></label>
      <label>Fondo<select id="fondo"><option value="si">Con fondo</option><option value="no">Sin fondo</option></select></label>
    </div>
    <div class="row" id="opFn" hidden>
      <label>Nombre de Epic<input id="nombre" placeholder="TuNombreEpic"></label>
      <label>Cuenta<select id="cuenta"><option value="epic">Epic (PC)</option><option value="psn">PlayStation</option><option value="xbl">Xbox</option></select></label>
      <label>Periodo<select id="ventana"><option value="season">Temporada</option><option value="lifetime">Histórico</option></select></label>
      <label>Código de creador<input id="codigo" value="KYOSUMI"></label>
      <label>Fila "Hoy"<select id="hoy"><option value="si">Sí</option><option value="no">No</option></select></label>
    </div>
    <code id="url"></code>
    <div class="row"><button type="button" id="copiar">Copiar enlace para OBS</button></div>
    <iframe id="prev" height="260" title="Vista previa del widget"></iframe>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
function url(demo) {
  const w = $('wid').value, p = new URLSearchParams({ tema: $('tema').value });
  if (w === 'spotify') { p.set('modo', $('modo').value); p.set('segundos', $('seg').value); p.set('fondo', $('fondo').value); }
  else { p.set('nombre', $('nombre').value || 'TuNombreEpic'); p.set('cuenta', $('cuenta').value); p.set('ventana', $('ventana').value); if ($('codigo').value) p.set('codigo', $('codigo').value); p.set('hoy', $('hoy').value); }
  if (demo) p.set('demo', '1');
  return new URL('overlays/' + w + '.html?' + p, location.href).href;
}
function upd() {
  $('opSp').hidden = $('wid').value !== 'spotify'; $('opFn').hidden = $('wid').value !== 'fortnite';
  $('url').textContent = url(false);
  $('prev').src = url($('demo').value === '1');
}
document.querySelectorAll('select,input').forEach(e => e.addEventListener('change', upd));
$('copiar').onclick = () => navigator.clipboard.writeText(url(false)).then(() => { $('copiar').textContent = '¡Copiado!'; setTimeout(() => $('copiar').textContent = 'Copiar enlace para OBS', 1500); });
upd();
</script>
</body>
</html>
