<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kyo · Sorteo y encuesta 2027</title>
<meta name="robots" content="noindex">
<!--
  KyoWidgets 2027 · Sorteo y encuesta · compactos · Fuente de navegador para OBS de 540×340 (multiplícalo por «escala»).
  Solo se ve mientras hay un sorteo o una encuesta. Lee la función «encuesta» de Supabase (trae los dos; si no existe,
  usa «sorteo»), como la de 2026:
  - Sorteo: premio, los nombres que entran como burbujas y el ganador (la ola tapa la tarjeta y aparece con chispas).
  - Encuesta: pregunta y opciones que se llenan con los votos; al cerrar, la ganadora (o el empate) pasa a oro.
  - Si hay los dos a la vez se turnan cada 10 s con una ola. El ganador y el resultado pasan delante 14 s.
  Parámetros:  escala  0.5 … 2     demo=1  ejemplo (responde a los botones de la vista previa)
-->
<link rel="stylesheet" href="../../fonts/escenas.css">
<script src="../../config.js"></script>
<script src="../sondeo.js"></script>
<script src="../escenas/pausa-obs.js"></script>
<style>
:root{--abisal:#0A1030;--indigo:#2B2F7A;--aleta:#3A7BD5;--bioluz:#6FE3F0;--espuma:#C9E6F2;--perla:#F5F3FB;--coral:#FF6F61;--menta:#5EF2B8;--oro:#F4C542;
  --sticker:0 0 0 5px var(--perla),0 0 0 10px var(--abisal),0 9px 0 10px var(--abisal)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
#w{position:relative;width:540px;height:340px;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--perla);transition:opacity .5s ease,transform .5s cubic-bezier(.34,1.56,.64,1)}
#w.oculto{opacity:0;transform:translateY(-20px) scale(.92)}
[hidden]{display:none!important}
.carta{position:absolute;left:12px;top:12px;width:510px;padding:16px 20px 14px;display:grid;gap:10px;border-radius:28px;background:rgba(10,16,48,.92);box-shadow:var(--sticker);overflow:hidden;isolation:isolate}
.carta.fuera{display:none}
.cab{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;font-family:"Chakra Petch",monospace;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--abisal);background:var(--bioluz);padding:4px 12px;border-radius:999px}
.chip.oro{background:var(--oro)}
.reloj{margin-left:auto;font-family:"Chakra Petch",monospace;font-weight:700;font-size:19px;color:var(--perla);background:var(--indigo);padding:3px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.pie{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:"Chakra Petch",monospace;font-size:15px;letter-spacing:.04em;color:var(--espuma)}
.pie b{color:var(--bioluz)} .pie small{color:#9aa6d6}
.cont{white-space:nowrap;font-weight:700;color:var(--abisal);background:var(--bioluz);padding:2px 10px;border-radius:999px}
.instr{animation:late 2.4s ease-in-out infinite}
@keyframes late{50%{opacity:.6}}

/* sorteo */
.premio{font-family:"Cherry Bomb One","Fredoka",sans-serif;font-size:40px;line-height:1.05;color:var(--perla);-webkit-text-stroke:9px var(--abisal);paint-order:stroke fill;overflow-wrap:anywhere}
.premio.largo{font-size:32px} .premio.muy{font-size:25px}
.pecera{position:relative;height:92px;border-radius:14px;background:linear-gradient(180deg,rgba(58,123,213,.35),rgba(43,47,122,.35));box-shadow:inset 0 0 0 2px rgba(111,227,240,.2);overflow:hidden}
.pecera.toque{animation:toque .5s ease}
@keyframes toque{40%{box-shadow:inset 0 0 0 3px var(--bioluz),0 0 14px rgba(111,227,240,.5)}}
.pecera .vacio{position:absolute;inset:0;display:grid;place-items:center;font-family:"Chakra Petch",monospace;font-size:14px;letter-spacing:.06em;color:var(--espuma);opacity:.8}
.bub{position:absolute;left:var(--x);bottom:-30px;font-family:"Fredoka",sans-serif;font-weight:600;font-size:15px;color:var(--perla);background:rgba(245,243,251,.14);border:2px solid rgba(201,230,242,.6);border-radius:999px;padding:2px 10px;white-space:nowrap;animation:sube var(--d) linear var(--del) infinite}
.bub.nueva{animation:subeUna 2.6s cubic-bezier(.34,1.3,.64,1) both,sube var(--d) linear 2.6s infinite;border-color:var(--bioluz);color:#fff}
@keyframes sube{from{transform:translateY(0)}to{transform:translateY(-140px)}}
@keyframes subeUna{0%{transform:translateY(0) scale(.6)}60%{transform:translateY(-52px) scale(1.12)}100%{transform:translateY(-60px) scale(1)}}
.pecera i{position:absolute;left:var(--x);bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;border:1.5px solid rgba(201,230,242,.55);animation:sube var(--d) linear var(--del) infinite}
.gana{display:none;justify-items:center;text-align:center;gap:2px;padding:6px 0 10px}
.gana.ver{display:grid}
.carta.ganador .pecera,.carta.ganador .pie,.carta.ganador .premio{display:none}
.gana .k{font-family:"Chakra Petch",monospace;font-weight:700;font-size:16px;letter-spacing:.22em;color:var(--espuma)}
.gana .n{font-family:"Cherry Bomb One","Fredoka",sans-serif;font-size:58px;line-height:1.05;color:var(--oro);-webkit-text-stroke:10px var(--abisal);paint-order:stroke fill;overflow-wrap:anywhere}
.gana .n.largo{font-size:44px} .gana .n.muy{font-size:34px}
.gana .n span{display:inline-block;animation:letra .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes letra{from{transform:translateY(20px) scale(.5);opacity:0}}
.gana .p{font-family:"Fredoka",sans-serif;font-weight:600;font-size:18px;color:var(--perla)}

/* encuesta */
.pregunta{font-family:"Fredoka",sans-serif;font-weight:700;font-size:25px;line-height:1.15;overflow-wrap:anywhere}
.pregunta.largo{font-size:21px} .pregunta.muy{font-size:18px}
.ops{display:grid;gap:8px;--h:36px}
.op{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:"Chakra Petch",monospace;font-weight:700;font-size:15px;color:var(--abisal);background:var(--bioluz)}
.vaso{position:relative;height:var(--h);border-radius:12px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);overflow:hidden;min-width:0}
.agua{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#2fd197,var(--menta));transition:width .8s cubic-bezier(.34,1.3,.64,1)}
.etq{position:absolute;left:12px;right:8px;top:50%;transform:translateY(-50%);font-family:"Fredoka",sans-serif;font-weight:700;font-size:18px;color:var(--perla);-webkit-text-stroke:5px var(--abisal);paint-order:stroke fill;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{text-align:right;font-family:"Chakra Petch",monospace;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;line-height:1;min-width:52px}
.pct small{display:block;font-size:11.5px;font-weight:600;color:#9aa6d6;white-space:nowrap}
.op.gano .vaso{box-shadow:inset 0 0 0 3px var(--oro),0 0 18px rgba(244,197,66,.45)}
.op.gano .agua{background:linear-gradient(90deg,#e0ac1c,var(--oro))}
.op.gano .num{background:var(--oro)}
.op.pierde{opacity:.45}

/* la ola que tapa la tarjeta (ganador y cambio de tarjeta) */
.ola{position:absolute;left:-10px;right:-10px;top:0;height:calc(100% + 40px);z-index:5;pointer-events:none;transform:translateY(105%)}
.ola svg{display:block;width:100%;height:36px}
.ola div{height:calc(100% - 34px);background:linear-gradient(180deg,var(--bioluz),var(--aleta) 45%,#152264)}
.ola.cubre{transform:translateY(-20px)}
.ola.sube{animation:olaSube 1.3s cubic-bezier(.5,0,.3,1) forwards}
.ola.baja{animation:olaBaja 1.1s cubic-bezier(.5,0,.3,1) forwards}
@keyframes olaSube{from{transform:translateY(105%)}to{transform:translateY(-20px)}}
@keyframes olaBaja{from{transform:translateY(-20px)}to{transform:translateY(105%)}}
.chispas{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:6}
.chispas i{position:absolute;width:13px;height:13px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:chispa 1.4s ease-out forwards}
@keyframes chispa{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){#w *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="w" class="oculto">
  <div class="carta fuera" id="cSorteo">
    <div class="cab"><span class="chip">Sorteo</span><span class="reloj" id="reloj" hidden></span></div>
    <div class="premio" id="premio">Sorteo</div>
    <div class="pecera" id="pecera"><div class="vacio" id="vacio">Aún no hay nadie dentro</div></div>
    <div class="pie"><span class="instr" id="instr"></span><span class="cont" id="cont">0 burbujas</span></div>
    <div class="gana" id="gana"><div class="k">¡FELICIDADES!</div><div class="n" id="gnombre"></div><div class="p" id="gpremio"></div></div>
    <div class="ola"><svg viewBox="0 0 540 36" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18 Q22 4 45 18 T90 18 T135 18 T180 18 T225 18 T270 18 T315 18 T360 18 T405 18 T450 18 T495 18 T540 18 V36 H0Z" fill="#6FE3F0" stroke="#F5F3FB" stroke-width="4"/></svg><div></div></div>
  </div>
  <div class="carta fuera" id="cEnc">
    <div class="cab"><span class="chip" id="eChip">Encuesta</span><span class="reloj" id="eReloj" hidden></span></div>
    <div class="pregunta" id="ePregunta"></div>
    <div class="ops" id="eOps"></div>
    <div class="pie"><span class="instr" id="eInstr"></span><span class="cont" id="eCont">0 votos</span></div>
    <div class="ola"><svg viewBox="0 0 540 36" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18 Q22 4 45 18 T90 18 T135 18 T180 18 T225 18 T270 18 T315 18 T360 18 T405 18 T450 18 T495 18 T540 18 V36 H0Z" fill="#6FE3F0" stroke="#F5F3FB" stroke-width="4"/></svg><div></div></div>
  </div>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search), $ = id => document.getElementById(id), w = $('w');
  const escala = Math.min(2, Math.max(0.5, Number(q.get('escala')) || 1)); if (escala !== 1) document.documentElement.style.zoom = escala;
  const DEMO = q.get('demo') === '1';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const VER_FINAL = 30000, URGENTE = 14000, TURNO = 10000, CAMBIO = 1300;
  const tarjeta = { sorteo: $('cSorteo'), encuesta: $('cEnc') };
  const olaDe = n => tarjeta[n].querySelector('.ola');
  let desfase = 0; const ahora = () => Date.now() + desfase;
  const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  function chispas(n, y) {
    const capa = document.createElement('div'); capa.className = 'chispas'; tarjeta[n].appendChild(capa);
    const cols = ['#F4C542', '#6FE3F0', '#FFB4A8', '#F5F3FB'];
    for (let i = 0; i < 34; i++) { const s = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 180;
      s.style.cssText = 'left:255px;top:' + (y || 110) + 'px;background:' + cols[i % 4] + ';--dx:' + Math.cos(a) * d + 'px;--dy:' + (Math.sin(a) * d - 40) + 'px;animation-delay:' + (Math.random() * .3) + 's'; capa.appendChild(s); }
    setTimeout(() => capa.remove(), 2000);
  }

  // ===================== SORTEO =====================
  const S = { visible: false, urgenteHasta: 0 };
  const pecera = $('pecera'), MAX_BUB = 18;
  let burbujas = [], vistos = new Set(), hueco = 0;
  for (let i = 0; i < 10; i++) { const m = document.createElement('i'); m.style.setProperty('--x', (Math.random() * 95) + '%'); m.style.setProperty('--s', (6 + Math.random() * 10) + 'px'); m.style.setProperty('--d', (6 + Math.random() * 6) + 's'); m.style.setProperty('--del', (-Math.random() * 10) + 's'); pecera.appendChild(m); }
  function burbuja(nombre, nueva) {
    const b = document.createElement('div'); b.className = 'bub' + (nueva ? ' nueva' : ''); b.textContent = nombre;
    const HUECOS = [3, 40, 68, 20, 55, 8, 46, 30, 62]; hueco = (hueco + 1) % HUECOS.length;
    b.style.setProperty('--x', (HUECOS[hueco] + Math.random() * 3) + '%'); b.style.setProperty('--d', (7 + Math.random() * 4) + 's');
    b.style.setProperty('--del', nueva ? '0s' : (-Math.random() * 10) + 's');
    pecera.appendChild(b); burbujas.push(b); if (burbujas.length > MAX_BUB) burbujas.shift().remove();
    if (nueva) { pecera.classList.remove('toque'); void pecera.offsetWidth; pecera.classList.add('toque'); }
    $('vacio').hidden = true;
  }
  function ponerPremio(t) { const p = $('premio'); p.textContent = t || 'Sorteo'; p.classList.toggle('largo', (t || '').length > 18); p.classList.toggle('muy', (t || '').length > 30); }
  let sCierre = null, sEstado = 'inactivo', palabra = '!participar', soloSubs = false, sTotal = 0;
  function pieSorteo(total) {
    sTotal = total; $('cont').textContent = total + (total === 1 ? ' burbuja' : ' burbujas');
    const abierto = sEstado === 'abierto' && (!sCierre || sCierre > ahora());
    $('instr').innerHTML = abierto ? 'Escribe <b>' + esc(palabra) + '</b>' + (soloSubs ? ' <small>(solo subs)</small>' : '') : '¡Entradas cerradas!';
  }
  function relojSorteo() { const r = $('reloj'); if (sEstado !== 'abierto' || !sCierre) { r.hidden = true; return; } const s = Math.max(0, Math.round((sCierre - ahora()) / 1000)); r.hidden = false; r.textContent = mmss(s); if (s === 0) pieSorteo(sTotal); }
  let sTemporizador = null;
  function mostrarGanador(nombre, premio, animar) {
    clearTimeout(sTemporizador);
    const g = $('gnombre'), c = tarjeta.sorteo;
    g.innerHTML = Array.from(nombre).map((ch, i) => '<span style="animation-delay:' + (animar ? 1.2 + i * .06 : 0) + 's">' + (ch === ' ' ? '&nbsp;' : esc(ch)) + '</span>').join('');
    g.classList.toggle('largo', nombre.length > 12); g.classList.toggle('muy', nombre.length > 18);
    $('gpremio').textContent = premio ? 'Se lleva: ' + premio : '';
    if (!animar) { c.classList.add('ganador'); $('gana').classList.add('ver'); return; }
    if (cambiando) { c.classList.add('ganador'); $('gana').classList.add('ver'); setTimeout(() => chispas('sorteo'), CAMBIO + 900); return; }
    // la ola tapa la tarjeta y, al bajar, aparece el nombre con chispas
    const ola = olaDe('sorteo'); ola.className = 'ola'; void ola.offsetWidth; ola.classList.add('sube');
    setTimeout(() => { c.classList.add('ganador'); $('gana').classList.add('ver'); ola.className = 'ola baja'; }, 1350);
    setTimeout(() => chispas('sorteo'), 2100);
  }
  function nuevoSorteo() { clearTimeout(sTemporizador); burbujas.forEach(b => b.remove()); burbujas = []; vistos = new Set(); $('vacio').hidden = false; tarjeta.sorteo.classList.remove('ganador'); $('gana').classList.remove('ver'); olaDe('sorteo').className = 'ola'; }
  let sRonda = null, ganadorVisto = null, primeraS = true;
  function aplicarSorteo(d) {
    if (!d) return;
    if (d.ahora) desfase = Date.parse(d.ahora) - Date.now();
    if (d.ronda !== sRonda) { nuevoSorteo(); sRonda = d.ronda; ganadorVisto = null; S.urgenteHasta = 0; }
    sEstado = d.estado; palabra = d.palabra || '!participar'; soloSubs = !!d.soloSubs; sCierre = d.cierra ? Date.parse(d.cierra) : null;
    if (d.estado === 'inactivo') { S.visible = false; primeraS = false; return; }
    ponerPremio(d.premio);
    (d.nombres || []).forEach(n => { if (!vistos.has(n)) { vistos.add(n); burbuja(n, !primeraS); } });
    primeraS = false; pieSorteo(d.total || 0); relojSorteo();
    if (d.estado === 'ganador' && d.ganador) {
      if (ganadorVisto === d.ganador.en) return;
      ganadorVisto = d.ganador.en;
      const hace = ahora() - Date.parse(d.ganador.en);
      if (hace > VER_FINAL) { S.visible = false; return; }
      S.visible = true; if (hace < URGENTE) S.urgenteHasta = Date.now() + (URGENTE - hace);
      decidir(); mostrarGanador(d.ganador.nombre, d.premio, hace < 15000);
      sTemporizador = setTimeout(() => { S.visible = false; decidir(); }, VER_FINAL - Math.max(0, hace));
      return;
    }
    tarjeta.sorteo.classList.remove('ganador'); $('gana').classList.remove('ver'); S.visible = true;
  }

  // ===================== ENCUESTA =====================
  const E = { visible: false, urgenteHasta: 0 };
  let eRonda = null, eCierre = null, eEstado = 'inactivo', cerradaVista = null, eTemporizador = null;
  function pintarOpciones(opciones) {
    const n = opciones.length, h = Math.max(24, Math.min(38, (168 - (n - 1) * 8) / n)), cont = $('eOps');
    cont.style.setProperty('--h', h + 'px');
    cont.innerHTML = opciones.map((o, i) => '<div class="op"><span class="num">' + (i + 1) + '</span><div class="vaso"><div class="agua"></div><span class="etq">' + esc(o) + '</span></div><span class="pct">0%<small>0</small></span></div>').join('');
  }
  function ponerPregunta(t) { const p = $('ePregunta'); p.textContent = t || 'Encuesta'; p.classList.toggle('largo', (t || '').length > 26); p.classList.toggle('muy', (t || '').length > 44); }
  function ponerVotos(votos, total) {
    $('eOps').querySelectorAll('.op').forEach((op, i) => { const v = votos[i] || 0, p = total ? Math.round(v / total * 100) : 0;
      op.querySelector('.agua').style.width = (total ? Math.max(3, v / total * 100) : 0) + '%';
      op.querySelector('.pct').innerHTML = p + '%<small>' + v + (v === 1 ? ' voto' : ' votos') + '</small>'; });
    $('eCont').textContent = total + (total === 1 ? ' voto' : ' votos');
  }
  function pieEncuesta(d) {
    const abierta = eEstado === 'abierta' && (!eCierre || eCierre > ahora()), n = (d.opciones || []).length;
    if (abierta) $('eInstr').innerHTML = 'Vota escribiendo <b>1</b>' + (n > 1 ? ' – <b>' + n + '</b>' : '');
    else if ((d.ganadoras || []).length > 1) $('eInstr').innerHTML = '¡Empate!';
    else if ((d.ganadoras || []).length === 1) $('eInstr').innerHTML = 'Ganó <b>' + esc(d.opciones[d.ganadoras[0]]) + '</b>';
    else $('eInstr').innerHTML = '¡Encuesta cerrada!';
    const c = $('eChip'); c.textContent = abierta ? 'Encuesta' : 'Resultado'; c.classList.toggle('oro', !abierta);
  }
  function relojEncuesta() { const r = $('eReloj'); if (eEstado !== 'abierta' || !eCierre) { r.hidden = true; return; } const s = Math.max(0, Math.round((eCierre - ahora()) / 1000)); r.hidden = false; r.textContent = mmss(s); }
  function marcarGanadoras(g) { $('eOps').querySelectorAll('.op').forEach((op, i) => { const gana = g.includes(i); op.classList.toggle('gano', gana); op.classList.toggle('pierde', g.length > 0 && !gana); }); }
  function aplicarEncuesta(d) {
    if (!d) return;
    if (d.ahora) desfase = Date.parse(d.ahora) - Date.now();
    if (d.ronda !== eRonda) { clearTimeout(eTemporizador); eRonda = d.ronda; cerradaVista = null; E.urgenteHasta = 0; if (d.estado !== 'inactivo') pintarOpciones(d.opciones || []); }
    eEstado = d.estado; eCierre = d.cierra ? Date.parse(d.cierra) : null;
    if (d.estado === 'inactivo') { E.visible = false; return; }
    if ($('eOps').children.length !== (d.opciones || []).length) pintarOpciones(d.opciones || []);
    ponerPregunta(d.pregunta); ponerVotos(d.votos || [], d.total || 0); pieEncuesta(d); relojEncuesta();
    if (d.estado === 'cerrada') {
      const cerrada = d.cerradaEn || d.cierra, hace = ahora() - Date.parse(cerrada);
      if (hace > VER_FINAL) { E.visible = false; return; }
      E.visible = true;
      if (cerradaVista !== cerrada) {
        cerradaVista = cerrada; marcarGanadoras(d.ganadoras || []);
        if (hace < URGENTE) { E.urgenteHasta = Date.now() + (URGENTE - hace); decidir(); if ((d.ganadoras || []).length) setTimeout(() => chispas('encuesta', 150), cambiando ? CAMBIO + 500 : 400); }
        clearTimeout(eTemporizador); eTemporizador = setTimeout(() => { E.visible = false; decidir(); }, VER_FINAL - Math.max(0, hace));
      }
      return;
    }
    marcarGanadoras([]); E.visible = true;
  }
  setInterval(() => { relojSorteo(); relojEncuesta(); }, 500);

  // ===================== qué tarjeta se ve (y los turnos con ola) =====================
  let turno = null, desde = 0, cambiando = false;
  function decidir() {
    if (cambiando) return;
    const quiere = []; if (S.visible) quiere.push('sorteo'); if (E.visible) quiere.push('encuesta');
    let meta;
    if (!quiere.length) meta = null;
    else if (S.visible && S.urgenteHasta > Date.now()) meta = 'sorteo';
    else if (E.visible && E.urgenteHasta > Date.now()) meta = 'encuesta';
    else if (quiere.length === 1) meta = quiere[0];
    else if (!quiere.includes(turno)) meta = quiere[0];
    else meta = Date.now() - desde > TURNO ? (turno === 'sorteo' ? 'encuesta' : 'sorteo') : turno;
    if (meta !== turno) cambiar(meta);
  }
  function cambiar(meta) {
    desde = Date.now();
    if (!meta) { w.classList.add('oculto'); const t = turno; turno = null; setTimeout(() => { if (!turno && t) tarjeta[t].classList.add('fuera'); }, 600); return; }
    if (!turno) { Object.keys(tarjeta).forEach(n => tarjeta[n].classList.toggle('fuera', n !== meta)); olaDe(meta).className = 'ola'; turno = meta; w.classList.remove('oculto'); return; }
    // la ola tapa la tarjeta que se va y, al bajar, deja ver la nueva
    const sale = turno; turno = meta; cambiando = true;
    const o1 = olaDe(sale); o1.className = 'ola'; void o1.offsetWidth; o1.classList.add('sube');
    setTimeout(() => {
      tarjeta[sale].classList.add('fuera'); olaDe(sale).className = 'ola'; tarjeta[meta].classList.remove('fuera');
      const o2 = olaDe(meta); o2.className = 'ola cubre'; void o2.offsetWidth; o2.className = 'ola baja';
      cambiando = false; desde = Date.now();
    }, CAMBIO);
  }
  setInterval(decidir, 400);

  // ===================== datos =====================
  if (DEMO) {
    const NOM = ['coral_byte_07', 'perla_pop', 'aleta_menta', 'fin_y_fan', 'burbujita99', 'arrecife_pixel', 'mareita_azul', 'tiburonzito', 'nube_de_sal', 'caracola', 'estrellita', 'PezGlobo'];
    const INACT_S = { estado: 'inactivo', ronda: 0 }, INACT_E = { estado: 'inactivo', ronda: 0 };
    let ds = INACT_S, de = INACT_E, n = 0; const t = () => new Date().toISOString();
    const abrirS = () => { n = 0; ds = { estado: 'abierto', ronda: Date.now(), premio: 'Peluche de Kyo', palabra: '!participar', soloSubs: false, cierra: null, total: 0, nombres: [], ganador: null, ahora: t() }; aplicarSorteo(ds); };
    const abrirE = () => { de = { estado: 'abierta', ronda: Date.now(), pregunta: '¿Qué jugamos el viernes?', opciones: ['League of Legends', 'Fortnite', 'Zenless Zone Zero', 'Just Chatting'], votos: [0, 0, 0, 0], total: 0, cierra: null, cerradaEn: null, ganadoras: [], ahora: t() }; aplicarEncuesta(de); };
    const entra = k => { for (let i = 0; i < k; i++) { const nom = NOM[n % NOM.length] + (n >= NOM.length ? n : ''); n++; ds.nombres = ds.nombres.concat(nom).slice(-40); ds.total = n; } ds.ahora = t(); aplicarSorteo(ds); };
    const vota = k => { for (let i = 0; i < k; i++) { const r = Math.random(), o = r < .42 ? 0 : r < .7 ? 2 : r < .9 ? 1 : 3; de.votos[o]++; de.total++; } de.ahora = t(); aplicarEncuesta(de); };
    abrirS(); entra(4); decidir();
    setInterval(() => { if (ds.estado === 'abierto' && n < 12) entra(1); if (de.estado === 'abierta' && de.total < 40) vota(2); }, 1200);
    window.addEventListener('message', e => {
      if (!e.data || e.data.type !== 'kyo-test') return;
      const a = e.data.accion;
      if (a === 'participantes') { if (ds.estado !== 'abierto') abrirS(); entra(4); }
      else if (a === 'ganador') { if (ds.estado === 'inactivo') { abrirS(); entra(6); } if (!n) entra(6); ds.estado = 'ganador'; ds.ganador = { nombre: ds.nombres[Math.floor(Math.random() * ds.nombres.length)], en: t() }; ds.ahora = ds.ganador.en; aplicarSorteo(ds); }
      else if (a === 'reiniciar') { de = INACT_E; aplicarEncuesta(de); abrirS(); entra(4); }
      else if (a === 'encuesta') { ds = INACT_S; aplicarSorteo(ds); abrirE(); vota(6); }
      else if (a === 'votos') { if (de.estado !== 'abierta') abrirE(); vota(8); }
      else if (a === 'cerrarEnc') { if (de.estado !== 'abierta') { abrirE(); vota(12); } const max = Math.max(...de.votos); de.estado = 'cerrada'; de.cerradaEn = t(); de.cierra = de.cerradaEn; de.ganadoras = de.votos.map((v, i) => v === max ? i : -1).filter(i => i >= 0); de.ahora = t(); aplicarEncuesta(de); }
      else if (a === 'ambos') { abrirS(); entra(6); abrirE(); vota(10); }
      decidir();
    });
    return;
  }
  const K = window.KYO || {};
  if (!K.SUPABASE_URL || /TU-PROYECTO/.test(K.SUPABASE_URL)) return;
  // rápido solo mientras hay un sorteo o una encuesta en pantalla; en reposo basta con mirar de vez en cuando
  const cada = () => (S.visible || E.visible) ? 3000 : 15000;
  const pedir = n => KyoSondeo.pedir(n, null, cada() * 0.8);
  KyoSondeo.bucle(async () => {
    let d = await pedir('encuesta').catch(() => null);
    if (d && d.ok) { aplicarSorteo(d.sorteo); aplicarEncuesta(d.encuesta); }
    else { d = await pedir('sorteo'); if (d && d.ok) aplicarSorteo(d); }   // sin la función «encuesta» sigue funcionando el sorteo
    decidir();
  }, cada);
})();
</script>
