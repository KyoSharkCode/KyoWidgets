<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kyo · Predicción 2027</title>
<meta name="robots" content="noindex">
<!--
  KyoWidgets 2027 · Predicción de Twitch (puntos del canal) · compacta · Fuente de navegador para OBS de 540×330
  (multiplícalo por «escala»). Lee la función «prediccion» de Supabase (como la de 2026):
  - Abierta: entra por su lado con la pregunta, el reloj (se pone en alerta los últimos 10 s) y una barra por opción.
  - Apuestas cerradas: lo dice 5 s y se encoge en una píldora con quién va ganando, hasta el resultado.
  - Resultado: la ganadora brilla en oro, sale quién ganó más y saltan chispas. A los 30 s se va.
  - Cancelada: «Puntos devueltos» unos segundos y se va.
  Hasta 10 opciones (más de 4 van en dos columnas).
  Parámetros:  lado  izq | der     escala  0.5 … 2     demo=1  ejemplo (responde a los botones de la vista previa)
-->
<link rel="stylesheet" href="../../fonts/escenas.css">
<script src="../../config.js"></script>
<script src="../sondeo.js"></script>
<script src="../escenas/pausa-obs.js"></script>
<style>
:root{--abisal:#0A1030;--indigo:#2B2F7A;--aleta:#3A7BD5;--bioluz:#6FE3F0;--espuma:#C9E6F2;--perla:#F5F3FB;--coral:#FF6F61;--coral-p:#FFB4A8;--oro:#F4C542;
  --sticker:0 0 0 5px var(--perla),0 0 0 10px var(--abisal),0 9px 0 10px var(--abisal)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
#w{position:relative;width:540px;height:330px;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--perla)}
[hidden]{display:none!important}
.pega{position:absolute;top:12px;border-radius:28px;background:rgba(10,16,48,.92);box-shadow:var(--sticker);transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .35s ease}
#w.izq .pega{left:12px} #w.der .pega{right:12px}
#w.izq .pega.fuera{transform:translateX(-120%);opacity:0} #w.der .pega.fuera{transform:translateX(120%);opacity:0}
.carta{width:510px;padding:16px 20px 14px;display:grid;gap:10px}
.carta.encoge{transform:scale(.6) translateY(-30%);opacity:0}
#w.izq .carta.encoge{transform-origin:left top} #w.der .carta.encoge{transform-origin:right top}
.cab{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;font-family:"Chakra Petch",monospace;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--abisal);background:var(--bioluz);padding:4px 12px;border-radius:999px}
.chip.gris{background:var(--espuma)} .chip.oro{background:var(--oro)}
.chip.salta{animation:salta .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes salta{40%{transform:scale(1.15)}}
.reloj{margin-left:auto;font-family:"Chakra Petch",monospace;font-weight:700;font-size:19px;color:var(--perla);background:var(--indigo);padding:3px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.reloj.poco{background:var(--coral);color:var(--abisal);animation:parpadea 1s steps(2) infinite}
@keyframes parpadea{50%{opacity:.55}}
.titulo{font-family:"Fredoka",sans-serif;font-weight:700;font-size:25px;line-height:1.15;overflow-wrap:anywhere}
.titulo.largo{font-size:21px}
.ops{display:grid;gap:8px;--h:40px}
.ops.dos{grid-template-columns:1fr 1fr;column-gap:12px}
.op{position:relative;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:"Chakra Petch",monospace;font-weight:700;font-size:15px;color:var(--abisal);background:var(--col)}
.vaso{position:relative;height:var(--h);border-radius:12px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);overflow:hidden;min-width:0}
.agua{position:absolute;inset:0 auto 0 0;width:0;background:var(--col);opacity:.9;transition:width .8s cubic-bezier(.34,1.3,.64,1)}
.agua::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.12) 14px 22px)}
.etq{position:absolute;left:12px;right:8px;top:50%;transform:translateY(-50%);font-family:"Fredoka",sans-serif;font-weight:700;font-size:18px;color:var(--perla);-webkit-text-stroke:5px var(--abisal);paint-order:stroke fill;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ops.dos .etq{font-size:15px}
.pct{text-align:right;font-family:"Chakra Petch",monospace;font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;line-height:1;min-width:52px}
.pct small{display:block;font-size:11.5px;font-weight:600;color:#9aa6d6;white-space:nowrap}
.ops.dos .pct{font-size:17px;min-width:40px}
.ops.dos .pct small{display:none}
.op.gano .vaso{box-shadow:inset 0 0 0 3px var(--oro),0 0 18px rgba(244,197,66,.45)}
.op.gano .num{background:var(--oro)}
.op.pierde{opacity:.42}
.pie{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:"Chakra Petch",monospace;font-size:14px;letter-spacing:.04em;color:var(--espuma)}
.pie b{color:var(--oro);font-weight:700}
.total{white-space:nowrap;color:var(--perla);background:rgba(111,227,240,.12);border:1px solid rgba(111,227,240,.35);padding:2px 10px;border-radius:999px}
/* píldora con las apuestas cerradas */
.mini{display:flex;align-items:center;gap:12px;max-width:510px;padding:10px 20px 10px 12px;border-radius:999px}
.mini .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--indigo);box-shadow:0 0 0 3px var(--bioluz)}
.mini .ic svg{width:20px;height:20px;fill:var(--perla)}
.mini .tx{display:grid;min-width:0}
.mini .t1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t2{font-family:"Chakra Petch",monospace;font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--espuma);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t2 b{color:var(--bioluz)}
.mini.vivo .ic{animation:latido 2s ease-in-out infinite}
@keyframes latido{50%{box-shadow:0 0 0 3px var(--bioluz),0 0 16px rgba(111,227,240,.7)}}
/* chispas del resultado */
.chispas{position:absolute;inset:0;pointer-events:none;overflow:visible}
.chispas i{position:absolute;width:13px;height:13px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:chispa 1.3s ease-out forwards}
@keyframes chispa{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){#w *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="w">
  <div class="carta pega fuera" id="carta">
    <div class="cab"><span class="chip" id="chip">Predicción</span><span class="reloj" id="reloj" hidden></span></div>
    <div class="titulo" id="titulo"></div>
    <div class="ops" id="ops"></div>
    <div class="pie"><span id="pie"></span><span class="total" id="total"></span></div>
  </div>
  <div class="mini pega fuera" id="mini">
    <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg></span>
    <span class="tx"><span class="t1" id="miniT"></span><span class="t2" id="miniS"></span></span>
  </div>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search), $ = id => document.getElementById(id), w = $('w');
  w.classList.add(q.get('lado') === 'der' ? 'der' : 'izq');
  const escala = Math.min(2, Math.max(0.5, Number(q.get('escala')) || 1)); if (escala !== 1) document.documentElement.style.zoom = escala;
  const DEMO = q.get('demo') === '1';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ENCOGER = 5000, VER_FINAL = 30000, VER_CANCEL = 7000;
  const COLS = ['#3A7BD5', '#FFB4A8', '#6FE3F0', '#C9E6F2', '#9aa6ff', '#FFD38A', '#7fd4ff', '#ffc9e6', '#b8f0ff', '#d6dcff'];
  const carta = $('carta'), mini = $('mini');
  let desfase = 0; const ahora = () => Date.now() + desfase;
  const pts = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K' : String(n);
  const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  // ---------- qué se ve: nada, la carta o la píldora ----------
  let vista = 'nada';
  function ver(v) {
    if (v === vista) return;
    const antes = vista; vista = v;
    if (v === 'carta') {
      mini.classList.add('fuera'); mini.classList.remove('vivo');
      if (antes === 'mini') { carta.classList.add('encoge'); carta.classList.remove('fuera'); void carta.offsetWidth; carta.classList.remove('encoge'); }
      else { carta.classList.remove('encoge'); carta.classList.remove('fuera'); }
    } else if (v === 'mini') {
      carta.classList.add('encoge');
      setTimeout(() => { if (vista === 'mini') { carta.classList.add('fuera'); carta.classList.remove('encoge'); mini.classList.remove('fuera'); mini.classList.add('vivo'); } }, 550);
    } else { carta.classList.remove('encoge'); carta.classList.add('fuera'); mini.classList.add('fuera'); mini.classList.remove('vivo'); }
  }

  // ---------- pintar ----------
  let pintadoId = null;
  function pintarOpciones(p) {
    const n = p.opciones.length, dos = n > 4, filas = dos ? Math.ceil(n / 2) : n;
    const ops = $('ops'); ops.className = 'ops' + (dos ? ' dos' : '');
    ops.style.setProperty('--h', (filas <= 2 ? 40 : filas === 3 ? 34 : filas === 4 ? 30 : 26) + 'px');
    ops.innerHTML = p.opciones.map((o, i) => '<div class="op" style="--col:' + COLS[i % COLS.length] + '"><span class="num">' + (i + 1) + '</span><div class="vaso"><div class="agua"></div><span class="etq">' + esc(o.titulo) + '</span></div><span class="pct">0%<small>0</small></span></div>').join('');
  }
  function ponerPuntos(p) {
    const t = p.total || 0;
    $('ops').querySelectorAll('.op').forEach((op, i) => {
      const o = p.opciones[i] || {}, v = o.puntos || 0, pc = t ? Math.round(v / t * 100) : 0;
      op.querySelector('.agua').style.width = (t && v ? Math.max(4, v / t * 100) : 0) + '%';
      op.querySelector('.pct').innerHTML = pc + '%<small>' + pts(v) + ' · ' + (o.gente || 0) + '</small>';
    });
    $('total').textContent = pts(t) + ' puntos';
  }
  function marcar(g) { $('ops').querySelectorAll('.op').forEach((op, i) => { op.classList.toggle('gano', i === g); op.classList.toggle('pierde', g >= 0 && i !== g); }); }
  function chip(txt, clase) { const c = $('chip'); if (c.textContent === txt) return; c.textContent = txt; c.className = 'chip ' + (clase || ''); void c.offsetWidth; c.classList.add('salta'); }
  function lider(p) { let m = -1, im = -1; p.opciones.forEach((o, i) => { if ((o.puntos || 0) > m) { m = o.puntos || 0; im = i; } }); return m > 0 ? im : -1; }
  function chispas() {
    const capa = document.createElement('div'); capa.className = 'chispas'; carta.appendChild(capa);
    const cols = ['#F4C542', '#6FE3F0', '#FFB4A8', '#F5F3FB'];
    for (let i = 0; i < 30; i++) { const s = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 170;
      s.style.cssText = 'left:255px;top:130px;background:' + cols[i % 4] + ';--dx:' + Math.cos(a) * d + 'px;--dy:' + (Math.sin(a) * d - 40) + 'px;animation-delay:' + (Math.random() * .25) + 's'; capa.appendChild(s); }
    setTimeout(() => capa.remove(), 1800);
  }

  // ---------- estado ----------
  let P = null, festejado = null, bloqueoVisto = null, cierre = null;
  function aplicar(p, ahoraSrv) {
    if (ahoraSrv) desfase = Date.parse(ahoraSrv) - Date.now();
    P = p;
    if (!p || !p.estado || p.estado === 'inactivo' || !p.opciones) { ver('nada'); return; }
    if (p.id !== pintadoId) { pintadoId = p.id; festejado = null; bloqueoVisto = null; pintarOpciones(p); }
    const t = p.titulo || 'Predicción';
    $('titulo').textContent = t; $('titulo').classList.toggle('largo', t.length > 34);
    ponerPuntos(p);
    cierre = p.cierra ? Date.parse(p.cierra) : null;
    const hace = x => ahora() - Date.parse(x), li = lider(p);
    if (p.estado === 'active') { marcar(-1); chip('Predicción'); $('pie').innerHTML = 'Apuesta tus <b>puntos del canal</b>'; ver('carta'); reloj(); return; }
    $('reloj').hidden = true;
    if (p.estado === 'locked') {
      marcar(-1); chip('Apuestas cerradas', 'gris');
      $('pie').innerHTML = li >= 0 ? 'Va ganando <b>' + esc(p.opciones[li].titulo) + '</b>' : 'Nadie apostó todavía';
      $('miniT').textContent = t;
      $('miniS').innerHTML = 'Apuestas cerradas · ' + (li >= 0 ? 'lidera <b>' + esc(p.opciones[li].titulo) + '</b> ' + Math.round((p.opciones[li].puntos || 0) / (p.total || 1) * 100) + '%' : 'esperando resultado') + ' · ' + pts(p.total || 0);
      const desde = p.bloqueada ? hace(p.bloqueada) : ENCOGER + 1;
      if (desde >= ENCOGER) ver('mini');
      else { ver('carta'); if (bloqueoVisto !== p.id) { bloqueoVisto = p.id; setTimeout(() => { if (P && P.id === p.id && P.estado === 'locked') ver('mini'); }, ENCOGER - desde); } }
      return;
    }
    if (p.estado === 'resolved') {
      const d = p.terminada ? hace(p.terminada) : 0;
      if (d > VER_FINAL) { ver('nada'); return; }
      const g = p.ganadora, o = p.opciones[g] || null;
      marcar(g); chip('¡Resultado!', 'oro');
      $('pie').innerHTML = o ? (o.top && o.top.gano ? 'Quien más ganó: <b>' + esc(o.top.nombre) + ' +' + pts(o.top.gano) + '</b>' : 'Ganó <b>' + esc(o.titulo) + '</b>') : '¡Terminó!';
      ver('carta');
      if (festejado !== p.id) { festejado = p.id; if (d < 12000) setTimeout(chispas, 500); setTimeout(() => { if (P && P.id === p.id) ver('nada'); }, VER_FINAL - Math.max(0, d)); }
      return;
    }
    if (p.estado === 'canceled') {
      const d = p.terminada ? hace(p.terminada) : 0;
      if (d > VER_CANCEL) { ver('nada'); return; }
      marcar(-1); chip('Cancelada', 'gris');
      $('ops').querySelectorAll('.op').forEach(op => op.classList.add('pierde'));
      $('pie').innerHTML = 'Puntos devueltos';
      ver('carta');
      if (festejado !== p.id) { festejado = p.id; setTimeout(() => { if (P && P.id === p.id) ver('nada'); }, VER_CANCEL - Math.max(0, d)); }
      return;
    }
    ver('nada');
  }
  function reloj() {
    const r = $('reloj');
    if (!P || P.estado !== 'active' || !cierre) { r.hidden = true; return; }
    const s = Math.max(0, Math.round((cierre - ahora()) / 1000));
    r.hidden = false; r.textContent = mmss(s); r.classList.toggle('poco', s <= 10);
  }
  setInterval(reloj, 500);

  // ---------- datos ----------
  if (DEMO) {
    const t = () => new Date().toISOString();
    let d = null, n = 0;
    const nueva = (ops) => { n++; d = { estado: 'active', id: 'demo' + n, titulo: '¿Ganará Kyo esta partida?', opciones: (ops || ['Sí, carrileo 🦈', 'No, hoy no']).map(x => ({ titulo: x, puntos: 0, gente: 0, top: null })), ganadora: -1, ventana: 120, creada: t(), cierra: new Date(Date.now() + 120000).toISOString(), bloqueada: null, terminada: null, total: 0, gente: 0 }; aplicar(d, t()); };
    const apuestas = k => { if (!d || d.estado !== 'active') return; for (let i = 0; i < k; i++) { const o = d.opciones[Math.random() < .62 ? 0 : Math.floor(Math.random() * d.opciones.length)]; const v = [50, 100, 250, 500, 1000, 2500][Math.floor(Math.random() * 6)]; o.puntos += v; o.gente++; if (!o.top || v > o.top.uso) o.top = { nombre: ['coral_byte_07', 'perla_pop', 'aleta_menta', 'fin_y_fan', 'burbujita99'][Math.floor(Math.random() * 5)], uso: v, gano: 0 }; } d.total = d.opciones.reduce((a, o) => a + o.puntos, 0); d.gente = d.opciones.reduce((a, o) => a + o.gente, 0); aplicar(d, t()); };
    const bloquear = () => { if (!d || d.estado !== 'active') { nueva(); apuestas(12); } d.estado = 'locked'; d.bloqueada = t(); aplicar(d, t()); };
    const resolver = () => { if (!d || (d.estado !== 'active' && d.estado !== 'locked')) { nueva(); apuestas(12); } d.estado = 'resolved'; d.ganadora = 0; d.terminada = t(); const o = d.opciones[0]; if (o.top) o.top.gano = Math.round(o.top.uso * (d.total / Math.max(1, o.puntos))); aplicar(d, t()); };
    const cancelar = () => { if (!d || (d.estado !== 'active' && d.estado !== 'locked')) { nueva(); apuestas(6); } d.estado = 'canceled'; d.terminada = t(); aplicar(d, t()); };
    nueva(); apuestas(8);
    setInterval(() => { if (d && d.estado === 'active' && d.gente < 60) apuestas(2); }, 1200);
    window.addEventListener('message', e => {
      if (!e.data || e.data.type !== 'kyo-test') return;
      const a = e.data.accion;
      if (a === 'abrir') { nueva(); apuestas(4); }
      else if (a === 'muchas') { nueva(['Top 1', 'Top 2–5', 'Top 6–10', 'Top 11–20', 'Más de 20', 'Muere en el bus']); apuestas(14); }
      else if (a === 'apuestas') { if (!d || d.estado !== 'active') nueva(); apuestas(10); }
      else if (a === 'bloquear') bloquear(); else if (a === 'resolver') resolver(); else if (a === 'cancelar') cancelar();
    });
    return;
  }
  const K = window.KYO || {};
  if (!K.SUPABASE_URL || /TU-PROYECTO/.test(K.SUPABASE_URL)) return;
  // rápido solo mientras hay una predicción abierta o cerrada; en reposo basta con mirar de vez en cuando
  const enMarcha = () => !!(P && (P.estado === 'active' || P.estado === 'locked'));
  const cada = () => enMarcha() ? 3000 : 15000;
  KyoSondeo.bucle(async () => { const d = await KyoSondeo.pedir('prediccion', null, cada() * 0.8); if (d) aplicar(d.prediccion, d.ahora); }, cada);
})();
</script>
</body>
</html>
