<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kyo · Cuenta atrás</title>
<meta name="robots" content="noindex">
<!--
  KyoWidgets · Cuenta atrás · Fuente de navegador para OBS. La URL la arma Kyo Estudio.
  Tamaños base (multiplícalos por "escala"): pegatina 860x280 · barra 860x150 · texto 860x240
  Parámetros:
    titulo     texto de arriba (p. ej. REVELACIÓN EN)
    modo       hasta | duracion
    hasta      fecha y hora local, formato 2026-10-31T20:00   (modo hasta)
    h, m, s    horas, minutos, segundos                        (modo duracion; empieza al abrirse en OBS)
    sesion     cambia este valor para reiniciar una cuenta de "duracion"
    diseno     pegatina | barra | texto        tema  marea | octubre | navidad
    acento, borde, caja, texto   colores (hex sin #)          escala  0.5 … 2
    etiquetas  si | no     alfinal  final | ocultar | cero     final  texto al llegar a cero
-->
<style>
@font-face{font-family:"Cherry Bomb One";src:url(../fonts/cherry-bomb-one-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-weight:700;src:url(../fonts/fredoka-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:700;src:url(../fonts/chakra-petch-latin-700-normal.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;background:transparent!important;overflow:hidden}
body{width:860px;height:280px;display:grid;place-items:center;font-family:"Fredoka",system-ui,sans-serif}
body.b-barra{height:150px}body.b-texto{height:240px}
#w{--a:#6FE3F0;--a2:#3A7BD5;--c:#0f1a4a;--t:#F5F3FB;--s:#C9E6F2;--o:#0A1030;--p:#fff;--u:#FF4D6A;position:relative;color:var(--t);transition:opacity .5s,transform .5s}
#w.octubre{--a:#FF8A2B;--a2:#9B6BFF;--c:#1a1240;--s:#e3d9ff;--o:#0a0720}
#w.navidad{--a:#FF5A6E;--a2:#F4C542;--c:#0e1a48;--s:#f3e7c4;--o:#060b22}
.pega{box-shadow:0 0 0 6px var(--p),0 0 0 11px var(--o),0 11px 0 11px var(--o)}
.caja{position:relative;display:grid;justify-items:center;gap:12px;padding:18px 34px 22px;border-radius:32px;background:var(--c);transform:rotate(-1.5deg);animation:boing 4.5s ease-in-out infinite}
.chip{font:700 20px "Chakra Petch",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--o);background:var(--a);padding:5px 18px;border-radius:999px;white-space:nowrap}
.digs{display:flex;align-items:flex-start;gap:10px}
.grupo{display:grid;justify-items:center;gap:6px}
.pares{display:flex;gap:6px}
.d{position:relative;width:64px;height:88px;border-radius:14px;background:var(--p);color:var(--o);display:grid;place-items:center;font:700 64px/1 "Chakra Petch",monospace;font-variant-numeric:tabular-nums;box-shadow:0 0 0 4px var(--o),0 6px 0 4px var(--o)}
.d::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:rgba(10,16,48,.12)}
.d.cambia{animation:flip .45s cubic-bezier(.34,1.56,.64,1)}
.lbl{font:700 13px "Chakra Petch",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--s)}
.sin-lbl .lbl{display:none}
.sep{font:700 56px/88px "Chakra Petch",monospace;color:var(--a);animation:parpadeo 1s steps(1) infinite}
/* barra */
.d-barra .caja{grid-auto-flow:column;align-items:center;gap:20px;padding:14px 26px;border-radius:999px}
.d-barra .d{width:44px;height:60px;font-size:42px;border-radius:10px}
.d-barra .sep{font-size:38px;line-height:60px}
.d-barra .lbl{display:none}
.d-barra .chip{font-size:18px}
/* texto (sin caja) */
.d-texto .caja{background:none;box-shadow:none!important;padding:0;gap:4px}
.d-texto .chip{background:none;color:var(--t);font:400 40px "Cherry Bomb One",sans-serif;letter-spacing:.02em;text-transform:none;-webkit-text-stroke:8px var(--o);paint-order:stroke fill;padding:0}
.d-texto .d{background:none;box-shadow:none;width:auto;min-width:58px;font:400 104px/1 "Cherry Bomb One",sans-serif;color:var(--t);-webkit-text-stroke:12px var(--o);paint-order:stroke fill;height:auto}
.d-texto .d::after{display:none}
.d-texto .pares{gap:0}
.d-texto .sep{font:400 90px/1 "Cherry Bomb One",sans-serif;color:var(--a);-webkit-text-stroke:10px var(--o);paint-order:stroke fill;line-height:1}
.d-texto .lbl{color:var(--t);-webkit-text-stroke:5px var(--o);paint-order:stroke fill}
/* últimos 10 segundos */
.urgente .d{color:var(--u);animation:latido 1s ease-in-out infinite}
.d-texto.urgente .d{color:var(--u)}
/* final */
.fin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.3) rotate(-6deg);opacity:0;white-space:nowrap;pointer-events:none;
  font:400 76px/1 "Cherry Bomb One",sans-serif;color:var(--a);-webkit-text-stroke:11px var(--o);paint-order:stroke fill;
  filter:drop-shadow(4px 0 0 var(--p)) drop-shadow(-4px 0 0 var(--p)) drop-shadow(0 4px 0 var(--p)) drop-shadow(0 -4px 0 var(--p)) drop-shadow(0 7px 0 var(--o))}
.terminado .fin{animation:finIn .7s cubic-bezier(.34,1.56,.64,1) forwards}
.terminado.con-final .caja{animation:none;opacity:0;transform:scale(.8);transition:opacity .35s,transform .35s}
.oculto{opacity:0;transform:scale(.7)}
.spk{position:absolute;width:40px;height:40px;pointer-events:none;animation:spk 1.4s ease-out forwards}
@keyframes flip{0%{transform:translateY(-10px) scale(1.12)}100%{transform:none}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes parpadeo{0%,60%{opacity:1}61%,100%{opacity:.35}}
@keyframes boing{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(-.5deg) translateY(-3px)}}
@keyframes finIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}}
@keyframes spk{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(140deg);opacity:0}}
</style>
</head>
<body>
<div id="w"><div class="caja pega"><span class="chip" id="tit"></span><div class="digs" id="digs"></div></div><div class="fin" id="fin"></div></div>
<script>
(function () {
  const q = new URLSearchParams(location.search), $ = id => document.getElementById(id), w = $('w');
  const diseno = ['pegatina', 'barra', 'texto'].includes(q.get('diseno')) ? q.get('diseno') : 'pegatina';
  const tema = ['marea', 'octubre', 'navidad'].includes(q.get('tema')) ? q.get('tema') : 'marea';
  w.classList.add('d-' + diseno, tema); document.body.classList.add('b-' + diseno);
  if (q.get('etiquetas') === 'no') w.classList.add('sin-lbl');
  const hex = v => /^[0-9a-f]{3,8}$/i.test(v || '') ? '#' + v : null;
  [['acento', '--a'], ['borde', '--p'], ['caja', '--c'], ['texto', '--t']].forEach(([k, v]) => { const c = hex(q.get(k)); if (c) w.style.setProperty(v, c); });
  const esc = Math.min(2, Math.max(0.5, Number(q.get('escala')) || 1)); if (esc !== 1) document.documentElement.style.zoom = esc;
  const titulo = q.get('titulo') ?? 'REVELACIÓN EN';
  if (titulo) $('tit').textContent = titulo; else $('tit').hidden = true;
  const alfinal = q.get('alfinal') || 'final', textoFinal = q.get('final') || '¡YA!';
  $('fin').textContent = textoFinal;

  // ---- momento objetivo ----
  let objetivo;
  if (q.get('modo') === 'duracion') {
    const dur = ((Number(q.get('h')) || 0) * 3600 + (Number(q.get('m')) || 0) * 60 + (Number(q.get('s')) || 0)) * 1000 || 3600000;
    const clave = 'kyo_cuenta_' + (q.get('sesion') || '0') + '_' + dur;
    let ini = null; try { ini = Number(localStorage.getItem(clave)) || null; } catch (e) {}
    if (!ini) { ini = Date.now(); try { localStorage.setItem(clave, String(ini)); } catch (e) {} }
    objetivo = ini + dur;
  } else {
    const v = q.get('hasta'); const d = v ? new Date(v) : null;
    objetivo = d && !isNaN(d) ? d.getTime() : Date.now() + 3600000;
  }

  // ---- dígitos ----
  let unidades = [], prev = '';
  function construir(conDias) {
    const U = conDias ? [['d', 'Días'], ['h', 'Horas'], ['m', 'Min'], ['s', 'Seg']] : [['h', 'Horas'], ['m', 'Min'], ['s', 'Seg']];
    $('digs').innerHTML = U.map(([k, l], i) => (i ? '<span class="sep">:</span>' : '') + '<div class="grupo"><div class="pares"><span class="d" data-u="' + k + '0">0</span><span class="d" data-u="' + k + '1">0</span></div><span class="lbl">' + l + '</span></div>').join('');
    unidades = U.map(u => u[0]); prev = '';
  }
  const dos = n => String(Math.min(99, Math.max(0, n))).padStart(2, '0');
  let terminado = false, extra = 0;
  function destellos() {
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span'); s.className = 'spk';
      s.innerHTML = '<svg viewBox="0 0 100 100"><path d="M50 0C53 38 62 47 100 50 62 53 53 62 50 100 47 62 38 53 0 50 38 47 47 38 50 0Z" fill="' + (i % 3 ? '#F4C542' : '#fff') + '"/></svg>';
      s.style.left = (30 + Math.random() * 40) + '%'; s.style.top = (30 + Math.random() * 30) + '%';
      s.style.setProperty('--dx', (Math.random() * 360 - 180) + 'px'); s.style.setProperty('--dy', (Math.random() * -160 - 20) + 'px');
      w.appendChild(s); setTimeout(() => s.remove(), 1600);
    }
  }
  function tick() {
    let rest = Math.max(0, Math.round((objetivo + extra - Date.now()) / 1000));
    const dias = Math.floor(rest / 86400), conDias = rest >= 100 * 3600;
    if (!unidades.length || (conDias !== unidades.includes('d'))) construir(conDias);
    const v = conDias ? { d: dias, h: Math.floor(rest % 86400 / 3600), m: Math.floor(rest % 3600 / 60), s: rest % 60 } : { h: Math.floor(rest / 3600), m: Math.floor(rest % 3600 / 60), s: rest % 60 };
    let txt = '';
    unidades.forEach(u => { const s = dos(v[u]); txt += s; [0, 1].forEach(i => { const el = w.querySelector('[data-u="' + u + i + '"]'); if (el.textContent !== s[i]) { el.textContent = s[i]; el.classList.remove('cambia'); void el.offsetWidth; el.classList.add('cambia'); } }); });
    w.classList.toggle('urgente', rest > 0 && rest <= 10);
    if (rest === 0 && !terminado) {
      terminado = true;
      if (alfinal === 'final') { w.classList.add('terminado', 'con-final'); destellos(); }
      else if (alfinal === 'ocultar') w.classList.add('oculto');
    }
    if (rest > 0 && terminado) { terminado = false; w.classList.remove('terminado', 'con-final', 'oculto'); }
    prev = txt;
  }
  tick(); setInterval(tick, 250);
  // Botones "Probar" de Kyo Estudio
  window.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'kyo-test') return;
    const falta = e.data.accion === 'final' ? 3 : 11;
    extra = (Date.now() + falta * 1000) - objetivo; tick();
    if (e.data.accion === 'reset') { extra = 0; tick(); }
  });
})();
</script>
</body>
</html>
