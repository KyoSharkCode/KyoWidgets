<div class="bubbles"></div><svg class="foam" viewBox="0 0 1920 60" preserveAspectRatio="none" aria-hidden="true"><path fill="rgba(201,230,242,.16)"/></svg></div><script>function initScene(sc,o){
  o=o||{};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var c=sc.querySelector('.sky'),x=c.getContext('2d'),stars=[],W=c.width,H=c.height,maxY=o.starMaxY||760;
  for(var i=0;i<(o.stars||260);i++) stars.push({x:Math.random()*W,y:Math.random()*maxY,r:Math.random()*1.8+.4,p:Math.random()*6.28,s:.6+Math.random()*1.6});
  var g=sc.querySelector('.glints'),gx=g&&g.getContext('2d'),strips=[],gw=g?g.width:0,gh=g?g.height:0;

  function draw(ts){var t=(ts||0)/1000;x.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){var s=stars[i];x.globalAlpha=.35+.65*Math.abs(Math.sin(t*s.s+s.p));x.fillStyle=i%9===0?'#C9E6F2':'#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}
    x.globalAlpha=1;
    if(g){gx.clearRect(0,0,gw,gh);for(var k=0;k<strips.length;k++){var st=strips[k],cx=gw/2+Math.sin(t*st.sp+st.o)*18*(1+st.y/120);gx.globalAlpha=(.25+.55*Math.abs(Math.sin(t*1.3*st.sp+st.o)))*(1-st.y/(gh*1.25));gx.fillStyle=k%4===0?'#6FE3F0':'#e9f4fb';var h=2+st.y/80;gx.beginPath();gx.ellipse(cx,st.y,st.w/2,h/2,0,0,6.283);gx.fill();}gx.globalAlpha=1;}
    if(!reduce) requestAnimationFrame(draw);}

    var r=o.bubbleZone||[0,W];b.style.left=(r[0]+Math.random()*(r[1]-r[0]))+'px';b.style.setProperty('--dx',(Math.random()*120-60)+'px');var dur=7+Math.random()*7;b.style.animationDuration=dur+'s';bb.appendChild(b);setTimeout(function(){b.remove();},dur*1000);}
  for(var n=0;n<8;n++)setTimeout(bubble,n*450);setInterval(bubble,o.bubbleEvery||700);
  var st=sc.querySelector('.stxt');
  if(st&&o.lines){var li=0;setInterval(function(){st.classList.add('out');setTimeout(function(){li=(li+1)%o.lines.length;st.textContent=o.lines[li];st.classList.remove('out');},420);},4200);}
  var ct=sc.querySelector('.ctime'),bar=sc.querySelector('.cbar span');

    var mm=Math.floor(left/60),ss=left%60;ct.textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;bar.style.width=((total-left)/total*100)+'%';left--;setTimeout(tick,1000);})();}
  var so=sc.querySelector('.sonar');if(so){var n2=40,pl=Math.round(n2*.66);for(var q=0;q<n2;q++){var sb=document.createElement('span');sb.style.height=(25+Math.abs(Math.sin(q*1.7)*55)+Math.abs(Math.cos(q*.6))*20)+'%';if(q<pl)sb.className='on';so.appendChild(sb);}}
}
