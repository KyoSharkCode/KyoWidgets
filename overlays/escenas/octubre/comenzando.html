<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Iniciando</title><link rel="stylesheet" href="../../../fonts/escenas.css"><style>html,body{margin:0;background:transparent;overflow:hidden}.scene{position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;

.scene *{box-sizing:border-box}

.clip{clip-path:path('M1020 -10 C 910 180, 1120 330, 1020 520 S 900 860, 990 1090 L 1930 1090 L 1930 -10 Z')}

.sea{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#2a4a9e 0,#1a3278 30%,#0c1a4c 100%)}
.glints{position:absolute;mix-blend-mode:screen}

.cbar{height:12px;border-radius:999px;background:rgba(201,230,242,.14);overflow:hidden}

.kyo{position:absolute;left:1320px;top:250px;width:620px;height:700px}
.chibi{position:absolute;left:10px;top:0;width:600px;height:600px;animation:float 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(10,16,48,.5))}
.front{position:absolute;inset:0;pointer-events:none}
.waterfront{position:absolute;left:900px;right:-20px;top:730px;height:360px;background:linear-gradient(180deg,rgba(111,227,240,.55) 0,rgba(58,123,213,.78) 8%,rgba(26,50,120,.95) 40%,#0c1a4c 100%);animation:swell 3.4s ease-in-out infinite}

.sign{position:absolute;font-family:"Cherry Bomb One","Fredoka",sans-serif;font-size:44px;color:#F5F3FB;-webkit-text-stroke:8px #0A1030;paint-order:stroke fill;filter:drop-shadow(0 5px 0 #2B2F7A)}
.ph{position:absolute;display:grid;place-items:center;font-family:"Chakra Petch",monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:rgba(201,230,242,.55)}
.tagph{position:absolute;font-family:"Chakra Petch",monospace;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#0A1030;background:#C9E6F2;padding:6px 14px;border-radius:999px}
/* chat frame */
.cframe{position:absolute;left:70px;top:70px;width:640px;height:950px;border-radius:44px;background:linear-gradient(180deg,rgba(18,26,69,.82),rgba(10,16,48,.9));
  box-shadow:0 0 0 4px #6FE3F0,0 0 34px rgba(111,227,240,.45),0 0 0 14px rgba(10,16,48,.55);overflow:hidden}

.ctab{position:absolute;left:110px;top:22px;padding:6px 42px 12px;border-radius:0 0 30px 30px;background:#0A1030;box-shadow:0 0 0 4px #6FE3F0,0 0 24px rgba(111,227,240,.4);
  font-family:"Cherry Bomb One","Fredoka",sans-serif;font-size:62px;line-height:1;color:#F5F3FB;-webkit-text-stroke:8px #0A1030;paint-order:stroke fill;z-index:3}
.msgs{position:absolute;left:34px;right:34px;bottom:70px;display:flex;flex-direction:column;gap:16px}
.msg{position:relative;background:rgba(245,243,251,.96);color:#1b1f4a;border-radius:26px 26px 26px 8px;padding:12px 20px 14px;font-size:26px;line-height:1.4;box-shadow:0 5px 0 rgba(10,16,48,.45);border-left:8px solid var(--rc)}
.msg .who{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:24px;color:var(--rn);display:flex;align-items:center;gap:8px}
.msg .who i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--rc);color:#fff;font-style:normal;font-size:14px;font-family:"Chakra Petch",monospace}
.emo{display:inline-block;width:32px;height:32px;vertical-align:-7px;border-radius:9px;background:linear-gradient(135deg,#6FE3F0,#3A7BD5);margin-inline:2px}
.m-anim{animation:msgIn 9s cubic-bezier(.34,1.56,.64,1) infinite}
.scal{position:absolute;left:0;right:0;bottom:0;height:40px;background:radial-gradient(circle at 20px 0,transparent 19px,rgba(111,227,240,.22) 20px) 0 0/40px 40px repeat-x}
/* game frame */
.gframe{position:absolute;left:24px;top:170px;width:1552px;height:873px;border-radius:30px;background:
  linear-gradient(rgba(111,227,240,.05) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(111,227,240,.05) 1px,transparent 1px) 0 0/64px 64px,rgba(5,8,26,.85);
  box-shadow:0 0 0 4px #6FE3F0,0 0 30px rgba(111,227,240,.45),0 0 0 14px rgba(10,16,48,.6)}
.corner{position:absolute;width:90px;height:90px}
.np{position:absolute;left:24px;top:30px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;width:600px;padding:14px 28px 14px 14px;border-radius:999px 36px 36px 999px;
  background:rgba(10,16,48,.9);box-shadow:0 0 0 3px rgba(111,227,240,.5),0 0 26px rgba(58,123,213,.35)}
.disc{width:100px;height:100px;border-radius:50%;position:relative;background:conic-gradient(from 0deg,#1a1f55,#2B2F7A,#3A7BD5,#6FE3F0,#2B2F7A,#1a1f55);animation:spin 8s linear infinite;box-shadow:0 0 0 4px #0A1030,0 0 0 7px #6FE3F0}
.disc::after{content:"";position:absolute;inset:33%;border-radius:50%;background:#0A1030;box-shadow:0 0 0 4px #C9E6F2}
.np .t{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:30px;line-height:1.15}
.np .a{font-size:22px;color:#C9E6F2}
.sonar{display:flex;align-items:flex-end;gap:4px;height:30px;margin-top:6px}
.sonar span{flex:1;background:#6FE3F0;border-radius:2px;opacity:.3}
.sonar span.on{opacity:1;box-shadow:0 0 6px #6FE3F0}
.now{position:absolute;left:660px;top:52px;display:flex;align-items:center;gap:16px;padding:12px 30px;border-radius:999px;background:rgba(10,16,48,.85);box-shadow:0 0 0 3px rgba(244,197,66,.6)}
.now b{font-family:"Cherry Bomb One","Fredoka",sans-serif;font-weight:400;font-size:34px;color:#F4C542}
.now span{font-size:28px;color:#F5F3FB}

@keyframes msgIn{0%{transform:translateY(24px) scale(.94);opacity:0}6%{transform:none;opacity:1}100%{opacity:1}}

<div class="bubbles"></div><svg class="foam" viewBox="0 0 1920 60" preserveAspectRatio="none" aria-hidden="true"><path fill="rgba(184,149,255,.16)"/></svg></div><script>function initScene(sc,o){
  o=o||{};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var c=sc.querySelector('.sky'),x=c.getContext('2d'),stars=[],maxY=o.starMaxY||760;
  for(var i=0;i<(o.stars||260);i++) stars.push({x:Math.random()*1920,y:Math.random()*maxY,r:Math.random()*1.8+.4,p:Math.random()*6.28,s:.6+Math.random()*1.6});
  var g=sc.querySelector('.glints'),gx=g&&g.getContext('2d'),strips=[],gw=g?g.width:0,gh=g?g.height:0;
  if(g) for(var j=0;j<70;j++){var t=Math.random();strips.push({y:Math.pow(t,1.4)*(gh-10)+4,w:(40+Math.random()*160)*(1-t*.5),o:Math.random()*6.28,sp:.5+Math.random()});}
  function draw(ts){var t=(ts||0)/1000;x.clearRect(0,0,1920,1080);
    for(var i=0;i<stars.length;i++){var s=stars[i];x.globalAlpha=.35+.65*Math.abs(Math.sin(t*s.s+s.p));x.fillStyle=i%9===0?'#C9E6F2':'#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}
    x.globalAlpha=1;
    if(g){gx.clearRect(0,0,gw,gh);for(var k=0;k<strips.length;k++){var st=strips[k],cx=gw/2+Math.sin(t*st.sp+st.o)*18*(1+st.y/120);gx.globalAlpha=(.25+.55*Math.abs(Math.sin(t*1.3*st.sp+st.o)))*(1-st.y/(gh*1.25));gx.fillStyle=k%4===0?'#6FE3F0':'#e9f4fb';var h=2+st.y/80;gx.beginPath();gx.ellipse(cx,st.y,st.w/2,h/2,0,0,6.283);gx.fill();}gx.globalAlpha=1;}
    if(!reduce) requestAnimationFrame(draw);}
  draw(0);
  var fp=sc.querySelector('.foam path');if(fp){var d='M0 60 L0 34 ';for(var f=0;f<=2000;f+=40){d+='Q'+(f+20)+' '+(f%80?14:6)+' '+(f+40)+' 34 ';}fp.setAttribute('d',d+'L2040 60 Z');}
  var bb=sc.querySelector('.bubbles');
  function bubble(){if(reduce||!bb)return;var b=document.createElement('span');b.className='bub';var sz=8+Math.random()*30;b.style.width=b.style.height=sz+'px';
    var r=o.bubbleZone||[0,1920];b.style.left=(r[0]+Math.random()*(r[1]-r[0]))+'px';b.style.setProperty('--dx',(Math.random()*120-60)+'px');var dur=7+Math.random()*7;b.style.animationDuration=dur+'s';bb.appendChild(b);setTimeout(function(){b.remove();},dur*1000);}
  for(var n=0;n<8;n++)setTimeout(bubble,n*450);setInterval(bubble,o.bubbleEvery||700);
  var st=sc.querySelector('.stxt');
  if(st&&o.lines){var li=0;setInterval(function(){st.classList.add('out');setTimeout(function(){li=(li+1)%o.lines.length;st.textContent=o.lines[li];st.classList.remove('out');},420);},4200);}
  var ct=sc.querySelector('.ctime'),bar=sc.querySelector('.cbar span');
  if(ct&&o.min){var total=o.min*60,left=total;(function tick(){
    if(left<=0){ct.textContent='¡Ya empezamos!';ct.classList.add('go');bar.style.width='100%';setTimeout(function(){left=total;ct.classList.remove('go');tick();},5000);return;}
    var mm=Math.floor(left/60),ss=left%60;ct.textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;bar.style.width=((total-left)/total*100)+'%';left--;setTimeout(tick,1000);})();}
  var so=sc.querySelector('.sonar');if(so){var n2=40,pl=Math.round(n2*.66);for(var q=0;q<n2;q++){var sb=document.createElement('span');sb.style.height=(25+Math.abs(Math.sin(q*1.7)*55)+Math.abs(Math.cos(q*.6))*20)+'%';if(q<pl)sb.className='on';so.appendChild(sb);}}
}
