<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kyo · Overlay combinado</title>
<!--
  Varios widgets en una sola fuente de navegador de OBS. Cada widget va en su hueco, con su propio estilo.
  El enlace lo da el Estudio (En directo → 🧩 Overlay combinado).

  Enlace en vivo (el de OBS):  ?v=<versión>&f=v|h
    Lee esa versión de Supabase (función "combo") cada 20 s: lo que guardes en el Estudio aparece solo,
    sin cambiar el enlace. Solo se recarga el widget que cambió. Sin conexión usa lo último que recibió.
  Enlace completo (la vista previa del Estudio y los enlaces antiguos):
    f       v (vertical 1080x1920) | h (horizontal 1920x1080)
    w       widgets que se ven, separados por comas (en orden de capa: el último queda encima)
    <id>    x,y,ancho,alto del hueco de ese widget
    <id>_   los parámetros propios del widget (los mismos de su enlace suelto)
-->
<style>
html,body{margin:0;background:transparent!important;overflow:hidden}
body{position:relative;width:1080px;height:1920px}
body.h{width:1920px;height:1080px}
iframe{position:absolute;border:0;background:transparent;overflow:hidden;pointer-events:none}
</style>
</head>
<body>
<script src="../config.js"></script>
<script>
  const q = new URLSearchParams(location.search), FMT = q.get('f') === 'h' ? 'h' : 'v', VER = q.get('v');
  if (FMT === 'h') document.body.className = 'h';
  const WIDGETS = ['spotify', 'fortnite', 'cuenta', 'contador', 'meta', 'chat', 'sorteo', 'prediccion', 'anuncios'];
  const marcos = {};
  const colocar = (f, [x, y, w, h]) => Object.assign(f.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });

  // Pinta una distribución {w:[ids], g:{id:[x,y,ancho,alto]}, p:{id:'parámetros'}}: mueve lo que se movió,
  // recarga solo el widget cuyo estilo cambió, quita los que ya no están y añade los nuevos (en su orden de capa)
  function pintar(d) {
    const ids = (d.w || []).filter((id, i, a) => WIDGETS.includes(id) && a.indexOf(id) === i);
    Object.keys(marcos).forEach(id => { if (!ids.includes(id)) { marcos[id].remove(); delete marcos[id]; } });
    ids.forEach((id, capa) => {
      const g = (d.g || {})[id];
      if (!Array.isArray(g) || g.length !== 4 || !g.every(Number.isFinite)) return;
      const src = id + '.html' + ((d.p || {})[id] ? '?' + d.p[id] : '');
      let f = marcos[id];
      if (!f) { f = marcos[id] = document.createElement('iframe'); f.title = id; f.scrolling = 'no'; f.setAttribute('allowtransparency', 'true'); document.body.appendChild(f); }
      colocar(f, g);
      f.style.zIndex = capa + 1; // capas por z-index: mover un iframe en la página lo recargaría
      if (f.getAttribute('src') !== src) f.setAttribute('src', src);
    });
  }

  if (VER) {
    const K = window.KYO || {}, CACHE = 'kyo_combo_' + VER + '_' + FMT;
    let firma = '';
    const usar = d => { const s = JSON.stringify(d); if (s === firma) return; firma = s; pintar(d); };
    try { const c = JSON.parse(localStorage.getItem(CACHE) || 'null'); if (c) usar(c); } catch (e) {}
    const leer = () => {
      if (!K.SUPABASE_URL) return;
      fetch(K.SUPABASE_URL + '/functions/v1/combo?v=' + encodeURIComponent(VER) + '&t=' + Date.now(), { headers: { apikey: K.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + K.SUPABASE_ANON_KEY } })
        .then(r => r.json())
        .then(r => { const d = r && r.ok && r.salida && r.salida[FMT]; if (d) { usar(d); try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {} } })
        .catch(() => {});
    };
    leer(); setInterval(leer, 20000);
  } else {
    const d = { w: (q.get('w') || '').split(','), g: {}, p: {} };
    d.w.forEach(id => { d.g[id] = (q.get(id) || '').split(',').map(Number); d.p[id] = q.get(id + '_') || ''; });
    pintar(d);
  }

  // Vista previa del Estudio: mover un hueco mientras se arrastra y reenviar las pruebas a su widget
  window.addEventListener('message', e => {
    const d = e.data || {}, f = marcos[d.widget];
    if (!f) return;
    if (d.type === 'kyo-combo-mover') colocar(f, [d.x, d.y, d.w, d.h]);
    else if (d.type === 'kyo-test') f.contentWindow.postMessage({ type: 'kyo-test', accion: d.accion }, '*');
  });
</script>
</body>
</html>
