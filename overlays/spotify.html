<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kyo · Música</title>
<meta name="robots" content="noindex">
<!--
  KyoWidgets · Música (Spotify) · Fuente de navegador para OBS. La URL la arma Kyo Estudio.
  Parámetros:
    diseno     vinilo | polaroid | casete | entrada
               tamaños base: vinilo 720x180 · polaroid 640x200 · casete 620x210 · entrada 640x190
    tema       octubre | marea          escala  0.5 … 2
    acento, borde, caja, texto          colores en hex sin # (vacío = los del tema;
                                        en las pegatinas, "borde" es el borde blanco)
    fuente     fredoka | cherry | chakra  (título; por defecto: vinilo = fredoka, pegatinas = cherry)
    etiqueta   texto de la etiqueta ("Sonando ahora")
    ocultar    portada,etiqueta,artista,progreso,tiempo   (lista separada por comas)
    modo       siempre | cambio          segundos (modo cambio)
    anim       rebote | deslizar | ninguna
    Solo vinilo:  fondo si|no · forma pildora|tarjeta
    demo       1 = canciones de ejemplo
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Fredoka:wght@600;700&family=Chakra+Petch:wght@600;700&display=swap">
<script src="../config.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent!important;overflow:hidden}
#w{
  --fondo:rgba(10,16,48,.92); --borde:#6FE3F0; --pega:#ffffff; --glow:rgba(111,227,240,.45); --acento:#6FE3F0; --txt:#F5F3FB; --sub:#C9E6F2; --contorno:#0A1030; --tinta:#2B2F7A;
  --g1:#1a1f55; --g2:#2B2F7A; --g3:#3A7BD5; --g4:#6FE3F0;
  position:absolute;left:0;top:0;font-family:"Fredoka",system-ui,sans-serif;color:var(--txt);
  transition:opacity .5s ease,transform .6s cubic-bezier(.34,1.56,.64,1)
}
#w.octubre{--fondo:rgba(26,18,64,.94);--borde:#9B6BFF;--glow:rgba(155,107,255,.5);--acento:#FF8A2B;--sub:#e3d9ff;--contorno:#0a0720;--tinta:#5a4fa0;--g1:#1a1150;--g2:#2a1f5c;--g3:#9B6BFF;--g4:#FF8A2B}
#w.oculto{opacity:0;transform:translateY(40px) scale(.94)}
#w.anim-deslizar.oculto{transform:translateX(-60px)}
#w.anim-ninguna{transition:opacity .3s}
#w.anim-ninguna.oculto{transform:none}
.portada{background:conic-gradient(var(--g1),var(--g3),var(--g4),var(--g2),var(--g1)) center/cover}
.titulo,.artista{white-space:nowrap}
.artista{overflow:hidden;text-overflow:ellipsis}
.marco{overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.titulo{display:inline-block;padding:0 40px 0 .12em}
.titulo.largo{animation:desliza var(--t,12s) linear infinite}
.f-fredoka .titulo{font-family:"Fredoka",sans-serif;font-weight:700}
.f-cherry .titulo{font-family:"Cherry Bomb One","Fredoka",sans-serif;font-weight:400}
.f-chakra .titulo{font-family:"Chakra Petch",monospace;font-weight:700}
.chip{display:inline-block;font:700 12px "Chakra Petch",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--contorno);background:var(--acento);padding:3px 10px;border-radius:999px}
.pega{background:var(--fondo);box-shadow:0 0 0 6px var(--pega),0 0 0 11px var(--contorno),0 11px 0 11px var(--contorno)}
.trazo{-webkit-text-stroke:6px var(--contorno);paint-order:stroke fill}
.sin-etiqueta .etq,.sin-etiqueta .chip,.sin-artista .artista,.sin-progreso .prog-zona,.sin-tiempo .tiempo{display:none!important}
.entra .anima{animation:pegaIn .7s cubic-bezier(.34,1.56,.64,1)}
.anim-ninguna.entra .anima{animation:none}
@keyframes desliza{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--d,-200px))}}
@keyframes pegaIn{0%{transform:scale(.6) rotate(-8deg)}100%{transform:none}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes boing{0%,100%{rotate:var(--r,-2deg)}50%{rotate:calc(var(--r,-2deg) + 1deg);translate:0 -3px}}

/* ============ VINILO (el diseño original) ============ */
.d-vinilo{width:720px;height:180px}
.d-vinilo .caja{position:absolute;left:10px;top:10px;width:700px;height:160px;display:flex;align-items:center;gap:22px;padding:14px 30px 14px 14px;border-radius:999px 44px 44px 999px}
.d-vinilo.tarjeta .caja{border-radius:28px}
.d-vinilo.con-fondo .caja{background:var(--fondo);box-shadow:0 0 0 4px var(--borde),0 0 28px var(--glow)}
.d-vinilo.sin-fondo .txt>*{-webkit-text-stroke:6px var(--contorno);paint-order:stroke fill}
.d-vinilo .disco{position:relative;flex:none;width:132px;height:132px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#0b0b18 0 3px,#171730 3px 5px);box-shadow:0 0 0 5px var(--contorno),0 0 0 9px var(--borde),0 0 22px var(--glow)}
.d-vinilo .gira{position:absolute;inset:0;border-radius:50%;animation:gira 6s linear infinite;animation-play-state:paused}
.sonando .gira,.sonando .rueda,.sonando .eq i,.sonando .disco-g{animation-play-state:running!important}
.d-vinilo .brillo{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 15%,rgba(255,255,255,.18) 20%,transparent 26% 65%,rgba(255,255,255,.12) 70%,transparent 76%)}
.d-vinilo .portada{position:absolute;inset:22%;border-radius:50%;box-shadow:0 0 0 3px var(--contorno)}
.d-vinilo .portada::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#0b0b18;box-shadow:0 0 0 2px var(--sub)}
.d-vinilo.sin-portada .disco{display:none}
.d-vinilo.sin-portada .caja{padding-left:30px;border-radius:44px}
.d-vinilo .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.d-vinilo .etq{display:flex;align-items:center;gap:8px;font-family:"Chakra Petch",monospace;font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--acento)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:var(--acento);border-radius:2px;height:30%;animation:eq .9s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.d-vinilo .titulo{font-size:36px;line-height:1.15}
.d-vinilo .artista{font-weight:600;font-size:22px;color:var(--sub)}
.d-vinilo .sonar{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:6px}
.d-vinilo .sonar span{flex:1;min-width:2px;border-radius:2px;background:var(--acento);opacity:.25;transition:opacity .3s}
.d-vinilo .sonar span.on{opacity:1;box-shadow:0 0 6px var(--acento)}
.d-vinilo .tiempo{display:flex;justify-content:space-between;font-family:"Chakra Petch",monospace;font-weight:600;font-size:14px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}

/* ============ POLAROID ============ */
.d-polaroid{width:640px;height:200px}
.d-polaroid .caja{position:absolute;left:30px;top:40px;width:580px;height:136px;display:flex;align-items:center;gap:20px;padding:14px 22px 14px 16px;border-radius:30px;--r:-2deg;animation:boing 4s ease-in-out infinite}
.d-polaroid .pola{position:relative;flex:none;width:106px;height:118px;background:#fff;border-radius:6px;padding:8px 8px 24px;transform:rotate(5deg);box-shadow:0 6px 0 var(--contorno)}
.d-polaroid .pola .portada{width:100%;height:100%;border-radius:3px}
.d-polaroid .cinta{position:absolute;top:-10px;left:26px;width:56px;height:20px;background:color-mix(in srgb,var(--acento) 70%,#fff);opacity:.9;transform:rotate(-6deg);border-radius:2px}
.d-polaroid.sin-portada .pola{display:none}
.d-polaroid .aleta{position:absolute;right:26px;top:-36px;width:56px;height:40px}
.d-polaroid .txt{min-width:0;flex:1}
.d-polaroid .titulo{margin-top:6px;font-size:33px;line-height:1.12}
.d-polaroid .artista{font-weight:700;font-size:19px;color:var(--sub)}
.d-polaroid .fila{display:flex;align-items:center;gap:12px;margin-top:9px}
.d-polaroid .dots{display:flex;gap:6px}
.d-polaroid .dots i{width:12px;height:12px;border-radius:50%;background:#fff3}
.d-polaroid .dots i.on{background:var(--acento);box-shadow:0 0 8px var(--acento)}
.d-polaroid .tiempo{font:700 13px "Chakra Petch",monospace;color:var(--sub);font-variant-numeric:tabular-nums}

/* ============ CASETE ============ */
.d-casete{width:620px;height:210px}
.d-casete .caja{position:absolute;left:30px;top:22px;width:560px;height:156px;border-radius:22px;padding:14px;--r:-1.5deg;animation:boing 4.5s ease-in-out infinite}
.d-casete .etiqueta{position:relative;height:84px;border-radius:12px;background:#fff;display:flex;align-items:center;gap:14px;padding:8px 14px 8px 8px;box-shadow:inset 0 0 0 4px var(--contorno)}
.d-casete .etiqueta .portada{flex:none;width:68px;height:68px;border-radius:8px;box-shadow:0 0 0 3px var(--contorno)}
.d-casete.sin-portada .etiqueta .portada{display:none}
.d-casete .etiqueta .txt{min-width:0;flex:1}
.d-casete .titulo{font-size:28px;line-height:1.12;color:var(--contorno)}
.d-casete .artista{font-weight:700;font-size:17px;color:var(--tinta)}
.d-casete .tira{position:absolute;right:18px;top:-11px}
.d-casete .cinta{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:270px;height:44px;border-radius:22px;background:#0006;box-shadow:inset 0 0 0 3px var(--contorno);display:flex;align-items:center;padding:0 10px}
.d-casete .rueda{flex:none;width:30px;height:30px;border-radius:50%;background:repeating-conic-gradient(#fff 0 30deg,#bbb 30deg 60deg);box-shadow:0 0 0 3px var(--contorno);animation:gira 2.4s linear infinite;animation-play-state:paused}
.d-casete .rueda::after{content:"";display:block;width:10px;height:10px;margin:10px;border-radius:50%;background:var(--contorno)}
.d-casete .prog{flex:1;height:6px;margin:0 10px;border-radius:6px;background:#fff3;overflow:hidden}
.d-casete .prog i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s linear}
.d-casete .tiempo{position:absolute;right:20px;bottom:22px;font:700 13px "Chakra Petch",monospace;color:var(--sub);font-variant-numeric:tabular-nums}
.d-casete .tornillo{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff5;box-shadow:inset 0 0 0 2px var(--contorno)}

/* ============ ENTRADA ============ */
.d-entrada{width:640px;height:190px}
.d-entrada .caja{position:absolute;left:30px;top:26px;width:580px;height:136px;--r:2deg;animation:boing 4s ease-in-out infinite;
  filter:drop-shadow(5px 0 0 var(--pega)) drop-shadow(-5px 0 0 var(--pega)) drop-shadow(0 5px 0 var(--pega)) drop-shadow(0 -5px 0 var(--pega)) drop-shadow(4px 0 0 var(--contorno)) drop-shadow(-4px 0 0 var(--contorno)) drop-shadow(0 4px 0 var(--contorno)) drop-shadow(0 -4px 0 var(--contorno)) drop-shadow(0 8px 0 var(--contorno))}
.d-entrada .ticket{display:flex;width:100%;height:100%}
.d-entrada .main{position:relative;flex:1;min-width:0;background:var(--fondo);border-radius:22px 0 0 22px;padding:16px 20px;display:flex;align-items:center;gap:16px;
  -webkit-mask:radial-gradient(circle 14px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 14px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 14px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 14px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.d-entrada .main .portada{flex:none;width:90px;height:90px;border-radius:14px;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--contorno);transform:rotate(-4deg)}
.d-entrada.sin-portada .main .portada{display:none}
.d-entrada .txt{min-width:0;flex:1}
.d-entrada .titulo{font-size:30px;line-height:1.12;margin-top:4px}
.d-entrada .artista{font-weight:700;font-size:18px;color:var(--sub)}
.d-entrada .talon{flex:none;width:118px;background:var(--acento);border-radius:0 22px 22px 0;border-left:4px dashed var(--contorno);display:grid;place-items:center;text-align:center;color:var(--contorno);
  -webkit-mask:radial-gradient(circle 14px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 14px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 14px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 14px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.d-entrada .talon b{display:block;font-family:"Cherry Bomb One",sans-serif;font-weight:400;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.d-entrada .talon small{display:block;font:700 11px "Chakra Petch",monospace;letter-spacing:.14em;text-transform:uppercase}
.d-entrada .talon .mini{width:78px;height:5px;margin:6px auto 0;border-radius:5px;background:#0003;overflow:hidden}
.d-entrada .talon .mini i{display:block;height:100%;width:0;background:var(--contorno);transition:width .3s linear}
.d-entrada.sin-tiempo .talon{display:none}
.d-entrada.sin-tiempo .main{border-radius:22px;-webkit-mask:none;mask:none}
</style>
</head>
<body>
<div id="w" class="oculto"></div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const w = document.getElementById('w');
  const hex = v => /^[0-9a-f]{3,8}$/i.test(v || '') ? '#' + v : null;
  const DIS = ['vinilo', 'polaroid', 'casete', 'entrada'];
  const diseno = DIS.includes(q.get('diseno')) ? q.get('diseno') : 'vinilo';
  const tema = q.get('tema') === 'marea' ? 'marea' : 'octubre';
  const modo = q.get('modo') === 'cambio' ? 'cambio' : 'siempre';
  const seg = Math.max(3, Number(q.get('segundos')) || 12);
  const etiqueta = q.get('etiqueta') || 'Sonando ahora';
  const fuente = q.get('fuente') || (diseno === 'vinilo' ? 'fredoka' : 'cherry');
  const ocultar = (q.get('ocultar') || '').split(',').filter(Boolean).map(k => k === 'disco' ? 'portada' : k === 'sonar' ? 'progreso' : k);

  const ALETA = '<svg class="aleta" viewBox="0 0 70 48" aria-hidden="true"><path d="M4 46 C 20 40 30 22 50 3 C 52 22 58 36 68 46 Z" fill="var(--pega)" stroke="var(--contorno)" stroke-width="5" stroke-linejoin="round"/></svg>';
  const T = {
    vinilo: '<div class="caja anima"><div class="disco"><div class="gira"><div class="portada"></div><div class="brillo"></div></div></div>' +
      '<div class="txt"><div class="etq"><span class="eq"><i></i><i></i><i></i><i></i></span><span data-etq></span></div>' +
      '<div class="marco"><span class="titulo" data-titulo></span></div><div class="artista" data-artista></div>' +
      '<div class="sonar prog-zona" data-sonar></div><div class="tiempo"><span data-t1>0:00</span><span data-t2>0:00</span></div></div></div>',
    polaroid: '<div class="caja pega anima"><div class="pola"><span class="cinta"></span><div class="portada"></div></div>' +
      '<div class="txt"><span class="chip" data-etq></span><div class="marco"><span class="titulo trazo" data-titulo></span></div><div class="artista" data-artista></div>' +
      '<div class="fila"><div class="dots prog-zona" data-dots></div><span class="tiempo"><span data-t1>0:00</span> / <span data-t2>0:00</span></span></div></div>' + ALETA + '</div>',
    casete: '<div class="caja pega anima"><span class="tornillo" style="left:8px;top:8px"></span><span class="tornillo" style="right:8px;top:8px"></span><span class="tornillo" style="left:8px;bottom:8px"></span><span class="tornillo" style="right:8px;bottom:8px"></span>' +
      '<div class="etiqueta"><div class="portada"></div><div class="txt"><div class="marco"><span class="titulo" data-titulo></span></div><div class="artista" data-artista></div></div><span class="chip tira" data-etq></span></div>' +
      '<div class="cinta"><span class="rueda"></span><span class="prog prog-zona"><i data-barra></i></span><span class="rueda"></span></div>' +
      '<div class="tiempo"><span data-t1>0:00</span> / <span data-t2>0:00</span></div></div>',
    entrada: '<div class="caja anima"><div class="ticket"><div class="main"><div class="portada"></div><div class="txt"><span class="chip" data-etq></span>' +
      '<div class="marco"><span class="titulo trazo" data-titulo></span></div><div class="artista" data-artista></div></div></div>' +
      '<div class="talon tiempo"><div><small>Tiempo</small><b data-t1>0:00</b><small>de <span data-t2>0:00</span></small><div class="mini prog-zona"><i data-barra></i></div></div></div></div></div>'
  };
  w.innerHTML = T[diseno];
  w.classList.add('d-' + diseno, tema, 'f-' + fuente, 'anim-' + (q.get('anim') || 'rebote'));
  if (diseno === 'vinilo') { w.classList.add(q.get('fondo') === 'no' ? 'sin-fondo' : 'con-fondo'); if (q.get('forma') === 'tarjeta') w.classList.add('tarjeta'); }
  ocultar.forEach(k => w.classList.add('sin-' + k));
  const esc = Math.min(2, Math.max(0.5, Number(q.get('escala')) || 1));
  if (esc !== 1) document.documentElement.style.zoom = esc;
  const set = (k, v) => w.style.setProperty(k, v);
  if (hex(q.get('acento'))) set('--acento', hex(q.get('acento')));
  if (hex(q.get('caja'))) set('--fondo', hex(q.get('caja')));
  if (hex(q.get('texto'))) set('--txt', hex(q.get('texto')));
  if (hex(q.get('borde'))) { set('--borde', hex(q.get('borde'))); set('--pega', hex(q.get('borde'))); set('--glow', hex(q.get('borde')) + '77'); }

  const $ = s => w.querySelector('[data-' + s + ']');
  const all = s => w.querySelectorAll('[data-' + s + ']');
  $('etq').textContent = etiqueta;

  // Progreso según el diseño
  const barras = [], puntos = [];
  if ($('sonar')) for (let i = 0; i < 44; i++) { const s = document.createElement('span'); $('sonar').appendChild(s); barras.push(s); }
  if ($('dots')) for (let i = 0; i < 14; i++) { const s = document.createElement('i'); $('dots').appendChild(s); puntos.push(s); }

  let actual = null, base = 0, baseAt = 0, playing = false, ocultarT = null;
  const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const semilla = txt => { let h = 7; for (const c of txt) h = (h * 31 + c.charCodeAt(0)) >>> 0; return () => ((h = (h * 1103515245 + 12345) >>> 0) / 4294967296); };
  function mostrar(v) { clearTimeout(ocultarT); w.classList.remove('oculto'); if (v === 'cambio') ocultarT = setTimeout(() => w.classList.add('oculto'), seg * 1000); }
  function ocultarW() { clearTimeout(ocultarT); w.classList.add('oculto'); }

  function pintarCancion(d) {
    $('titulo').textContent = d.title || '';
    $('artista').textContent = d.artist || '';
    w.querySelectorAll('.portada').forEach(p => p.style.backgroundImage = d.cover ? 'url("' + d.cover + '")' : '');
    const r = semilla((d.title || '') + (d.artist || ''));
    barras.forEach(b => b.style.height = (22 + r() * 78) + '%');
    const t = $('titulo'); t.classList.remove('largo');
    requestAnimationFrame(() => {
      const hueco = t.parentElement.clientWidth, ancho = t.scrollWidth;
      if (ancho > hueco) { t.style.setProperty('--d', (hueco - ancho) + 'px'); t.style.setProperty('--t', Math.max(8, (ancho - hueco) / 25 + 6) + 's'); t.classList.add('largo'); }
    });
    w.classList.remove('entra'); void w.offsetWidth; w.classList.add('entra');
  }

  function recibir(d) {
    if (!d || !d.ok) { if (d && d.error) console.warn('Kyo música:', d.error); ocultarW(); return; }
    if (!d.title) { ocultarW(); return; }
    const cambio = !actual || actual.id !== d.id || actual.title !== d.title;
    playing = !!d.playing;
    w.classList.toggle('sonando', playing);
    $('etq').textContent = playing ? etiqueta : 'En pausa';
    base = d.progress_ms || 0; baseAt = Date.now();
    actual = d;
    if (cambio) { pintarCancion(d); mostrar(modo); }
    else if (modo === 'siempre' && playing) mostrar('siempre');
    if (!playing && modo === 'siempre') { clearTimeout(ocultarT); ocultarT = setTimeout(ocultarW, 4000); }
  }

  setInterval(() => {
    if (!actual) return;
    const dur = actual.duration_ms || 1;
    const p = Math.min(dur, base + (playing ? Date.now() - baseAt : 0));
    all('t1').forEach(e => e.textContent = fmt(p));
    all('t2').forEach(e => e.textContent = fmt(dur));
    const f = p / dur;
    barras.forEach((b, i) => b.classList.toggle('on', i < Math.round(barras.length * f)));
    puntos.forEach((b, i) => b.classList.toggle('on', i < Math.round(puntos.length * f)));
    all('barra').forEach(b => b.style.width = (f * 100) + '%');
  }, 250);

  const EJ = [
    { id: 'a', title: 'Marea de medianoche', artist: 'Artista de ejemplo', duration_ms: 214000 },
    { id: 'b', title: 'Un título de canción bastante largo para ver cómo se desliza', artist: 'Otra artista', duration_ms: 187000 },
    { id: 'c', title: 'Luna calabaza', artist: 'Banda de prueba', duration_ms: 241000 }
  ];
  let k = 0;
  const ejemplo = () => { const s = EJ[k++ % EJ.length]; recibir(Object.assign({ ok: true, playing: true, progress_ms: 30000 + Math.random() * 60000, cover: null }, s)); };

  async function consultar() {
    try {
      const K = window.KYO || {};
      const r = await fetch(K.SUPABASE_URL + '/functions/v1/spotify-now-playing', { headers: { apikey: K.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + K.SUPABASE_ANON_KEY } });
      recibir(await r.json());
    } catch (e) { console.warn('Kyo música: sin conexión', e); }
  }

  window.addEventListener('message', e => { if (e.data && e.data.type === 'kyo-test' && e.data.accion === 'cancion') ejemplo(); });

  if (q.get('demo') === '1') { ejemplo(); setInterval(ejemplo, 15000); }
  else { consultar(); setInterval(consultar, 5000); }
})();
</script>
